name: Deploy the game to GitHub Pages

# Rebuilds the touch web app from its sources and publishes docs/ as the site.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'data/**'
      - 'docs/**'
      - 'tools/build_web.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the page from the sources
        run: python tools/build_web.py
      - name: Check that the build is what is committed
        run: git diff --stat --exit-code -- docs/index.html web/dread.html || echo "::warning::docs/index.html was out of date; the freshly built one is published"
      - name: Check the pieces the site needs
        run: |
          test -f docs/index.html && test -f docs/manifest.webmanifest && test -f docs/sw.js
          test -f docs/icons/icon-192.png && test -f docs/icons/icon-512.png && test -f docs/icons/apple-touch-icon.png
          grep -q 'rel="manifest"' docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
