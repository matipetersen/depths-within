<style>
/* Layout concept: a landscape bridge. Left, the honest ledger. Centre, the men (what they say,
   what can be seen). Right, the log with the three thumb buttons underneath. Everything else is
   a sheet that slides over: orders, a decision, the ending. Palette: slate that has been under
   water too long, pale paper for text, brass only for what needs attention. */
:root {
  color-scheme: dark;
  --hull: #0a1117;        /* the deep: slate with a green bias */
  --panel: #101a21;
  --panel-hi: #17252e;
  --line: #243640;
  --paper: #dbe2d8;       /* text: a warm off-white, never pure */
  --dim: #8a9a9d;
  --sea: #78b8a0;         /* ok / active */
  --brass: #d1a64e;       /* attention */
  --rust: #cf6a47;        /* critical */
  --ink: #0a1117;         /* text on a lit button */
  --display: "Special Elite", "Courier New", ui-monospace, monospace;
  --body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--hull); color: var(--paper);
  font: 15px/1.35 var(--body); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.smcaps { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }

#app {
  height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px;
  padding-block: 6px 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
}

/* ---- top bar */
.top { display: flex; align-items: center; gap: 10px; min-height: 46px; min-width: 0; }
.orders-chip {
  flex: 1 1 auto; min-width: 0; text-align: left; background: transparent; border: 0; padding: 4px 0;
  display: grid; gap: 1px;
}
.orders-chip .t { font-family: var(--display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orders-chip .p { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { text-align: right; white-space: nowrap; font-family: var(--mono); font-size: 13px; }
.clock small { display: block; color: var(--brass); font-size: 11px; font-family: var(--body); }
.icon-btn {
  width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; font-size: 18px;
}
.icon-btn[aria-pressed="true"] { border-color: var(--sea); color: var(--sea); }
.icon-btn { position: relative; }
.icon-btn.off { color: var(--dim); }
.icon-btn.off::after { content: ""; position: absolute; width: 26px; height: 2px; background: var(--dim); transform: rotate(-45deg); }

/* ---- columns */
.cols { display: grid; grid-template-columns: minmax(190px, 26%) minmax(210px, 34%) minmax(0, 1fr); gap: 8px; min-height: 0; }
.col { min-height: 0; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; }
.col > header { padding: 8px 10px 6px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; flex: 1 1 auto; padding: 8px 10px; }

/* ledger */
.led { display: grid; gap: 9px; }
.led .r { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.led .k { font-size: 13px; }
.bar { height: 10px; background: #0b1319; border: 1px solid var(--line); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--sea); }
.r.low .bar i { background: var(--brass); }
.r.crit .bar i { background: var(--rust); }
.led .v { font-family: var(--mono); font-size: 13px; min-width: 3.4em; text-align: right; }
.r.low .v { color: var(--brass); }
.r.crit .v { color: var(--rust); }
.led .sub { grid-column: 2 / 4; font-size: 11px; color: var(--dim); margin-top: -4px; }
.led .flag { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.air { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding-top: 2px; border-top: 1px dashed var(--line); }
.air.foul, .air.dangerous { color: var(--rust); }
.air.stale { color: var(--brass); }

/* the men */
.men { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.men li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 5px 2px; border-bottom: 1px solid #16232b; align-items: baseline; }
.men li.sym { padding-bottom: 6px; }
.men .n { font-weight: 600; }
.men .role { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 13px; }
.men .says { color: var(--paper); font-style: italic; font-size: 13px; text-align: right; }
.men .seen { grid-column: 1 / 3; font-size: 12px; color: var(--brass); }
.men li.gone .n { text-decoration: line-through; color: var(--dim); }
.badge { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--brass); color: var(--brass); padding: 0 5px; margin-left: 6px; }
.sonar { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; }
.sonar b { color: var(--sea); letter-spacing: .1em; font-size: 11px; }
.sonar.off b { color: var(--dim); }
.sonar p { margin: 3px 0 0; color: var(--paper); font-style: italic; }

/* log */
.log { font: 12.5px/1.45 var(--mono); }
.log p { margin: 0 0 5px; padding-left: 4.4em; text-indent: -4.4em; }
.log .tk { color: var(--dim); }
.log .ord { color: var(--brass); }
.log .ch { color: var(--sea); }
.log .mis { color: var(--paper); font-weight: 500; }
.col.logcol .scroll { padding-bottom: 4px; }
.notice { min-height: 30px; padding: 4px 10px; font-size: 13px; line-height: 1.25; color: var(--sea); border-top: 1px solid var(--line); display: flex; align-items: center; }
.btn { white-space: nowrap; }
.btn small { white-space: normal; }
.tabs { padding: 0 !important; gap: 0; }
.tab { flex: 1; white-space: nowrap; min-height: 40px; padding: 0 8px; font: 600 11px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--dim); background: transparent; border: 0; border-bottom: 2px solid transparent; }
.tab.on { color: var(--brass); border-bottom-color: var(--brass); }
.chart { display: block; width: 100%; height: auto; background: var(--hull); border: 1px solid var(--line); border-radius: 4px; }
.chart .sea { fill: #0c161d; } .chart .gl { stroke: var(--line); stroke-width: .25; } .chart .gt { fill: var(--dim); font: 3px var(--mono); }
.chart .land { fill: #1d2a2c; stroke: var(--line); stroke-width: .3; } .chart .wl { fill: var(--dim); font: 3px var(--body); }
.chart .trk { fill: none; stroke-width: .6; } .chart .trk.done { stroke: var(--line); } .chart .trk.current { stroke: var(--brass); stroke-dasharray: 1.6 1.2; }
.chart .wp { fill: var(--hull); stroke: var(--dim); stroke-width: .5; } .chart .wp.hit { fill: var(--sea); stroke: var(--sea); } .chart .wp.next { stroke: var(--brass); stroke-width: .8; }
.chart .boat path { fill: var(--paper); stroke: var(--ink); stroke-width: .3; } .chart .boat .halo { fill: none; stroke: var(--sea); stroke-width: .35; opacity: .6; animation: ping 3s ease-out infinite; transform-origin: 0 0; }
.chart .boat.up path { fill: var(--brass); }
@keyframes ping { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.3); opacity: 0; } }
.scopehead { display: flex; justify-content: space-between; font: 500 11px var(--body); letter-spacing: .1em; color: var(--dim); margin-bottom: 4px; } .scopehead b { color: var(--sea); }
.scope { display: block; width: 100%; max-width: 230px; margin: 0 auto; height: auto; }
.scope .face { fill: #08110f; stroke: var(--sea); stroke-width: .5; } .scope.dark .face { stroke: var(--line); fill: #0a1117; }
.scope .ring { stroke: #1d3a33; stroke-width: .3; fill: none; } .scope .gt { fill: var(--dim); font: 4px var(--mono); }
.scope .sweep { stroke: var(--sea); stroke-width: .6; opacity: .55; transform-origin: 50px 50px; animation: sweep 4s linear infinite; }
@keyframes sweep { to { transform: rotate(360deg); } }
.scope .blip circle { fill: var(--sea); } .scope .blip text { fill: var(--paper); font: 4px var(--mono); } .scope .me { fill: var(--paper); }
.cts { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.cts li { display: grid; grid-template-columns: 2.2em auto; gap: 0 6px; } .cts li .dim { grid-column: 2; font-size: 11.5px; } .cts b { color: var(--sea); font-family: var(--mono); }
.scopemsg { margin: 8px 0 0; font-size: 13px; }
.tubes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
.tube { border: 1px solid var(--line); border-radius: 3px; padding: 3px 5px; display: grid; background: var(--panel-hi); }
.tube .tn { font: 500 13px var(--mono); } .tube .tn small { font: 10px var(--body); color: var(--dim); margin-left: 4px; text-transform: uppercase; } .tube .ts { font-size: 11.5px; color: var(--dim); }
.tube.loaded { border-color: var(--sea); } .tube.flooded { border-color: var(--brass); } .tube.open { border-color: var(--rust); } .tube.open .ts { color: var(--rust); } .tube.no-report .ts { color: var(--dim); }
.sol { width: 100%; border-collapse: collapse; font: 11px var(--mono); white-space: nowrap; } .sol th { color: var(--dim); font: 500 10px var(--body); text-align: left; letter-spacing: .08em; text-transform: uppercase; } .sol td, .sol th { padding: 2px 3px; } .sol b { color: var(--sea); }
.eyegrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.eye { display: block; width: 100%; height: auto; border-radius: 4px; } .eye .sky { fill: #1b2b33; } .eye .water { fill: #0d1f24; } .eye .horizon { stroke: #6f8d93; stroke-width: .3; }
.eye .rim { fill: none; stroke: #000; stroke-width: 5; } .eye .ret { stroke: #a9c3b6; stroke-width: .2; opacity: .5; } .eye .rt { stroke: #a9c3b6; stroke-width: .3; }
.eye .hull, .eye .sup { fill: #0b1013; stroke: #3b4c52; stroke-width: .3; } .eye .white { fill: #c9d2cf; } .eye .mast { stroke: #0b1013; stroke-width: .6; }
.eye .red { fill: var(--rust); } .eye .fig { fill: #02040a; } .eye .lamp { fill: #e8c46a; } .eye .wake { stroke: #a9c3b6; stroke-width: .5; fill: none; opacity: .6; }
.eye .ghostv { opacity: .35; } .eye .ghostv .hull, .eye .ghostv .sup { fill: #1c2a30; } .eye .edge { fill: var(--brass); }
.eyeread { margin: 6px 0 0; font-size: 13px; } .eyebtns { display: grid; gap: 8px; }
.chart .errc { fill: rgba(209,166,78,.10); stroke: var(--brass); stroke-width: .3; stroke-dasharray: 1 1; }
.eye .mist { fill: rgba(150,170,170,.35); }
.sheet.attack { border-top: 3px solid var(--rust); } .sheet.attack > header h2 { color: var(--rust); }
.grp { margin: 12px 0 6px; } .grp:first-child { margin-top: 0; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.gg { background: var(--panel-hi); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; display: grid; gap: 1px; min-width: 0; }
.gg.wide { grid-column: 1 / -1; }
.gk { font: 500 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.gv { font: 500 17px var(--mono); color: var(--paper); } .gv small { font-size: 11px; color: var(--dim); } .gv.sm { font: 500 13px var(--body); }
.bar.sm { display: block; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; } .bar.sm i { display: block; height: 100%; background: var(--sea); }
.hullsvg { display: block; width: 100%; height: auto; } .hullsvg .cp { stroke: var(--hull); stroke-width: .6; } .hullsvg .tower { fill: var(--panel-hi); stroke: var(--line); stroke-width: .5; }
.hullsvg .cp.sound { fill: var(--sea); } .hullsvg .cp.damaged { fill: var(--brass); } .hullsvg .cp.flooding { fill: var(--rust); }
.comp { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.comp li { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 13px; }
.comp .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; } .comp .bar i { display: block; height: 100%; background: var(--sea); }
.comp li.damaged .bar i { background: var(--brass); } .comp li.flooding .bar i { background: var(--rust); }
.comp .st { grid-column: 1 / -1; font-size: 11px; color: var(--dim); margin-top: -3px; } .comp li.flooding .st { color: var(--rust); }
.step {
  flex: none;
  display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: baseline;
  margin: 6px 6px 0; padding: 6px 10px; min-height: 48px; text-align: left; border: 1px solid var(--brass); border-radius: 4px;
  background: var(--panel-hi); color: var(--paper); font: inherit;
}
.step .k { font: 500 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.step .t { font: 600 14px/1.15 var(--body); min-width: 0; }
.step .s { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); line-height: 1.2; }
button.step.ready { background: var(--brass); color: var(--ink); }
button.step.ready .k, button.step.ready .s { color: #3a2f12; }
button.step.blocked { border-color: var(--line); }
button.step.blocked .k { color: var(--dim); }
button.step.blocked .s { color: var(--rust); }
button.step.going { border-style: dashed; }
button.step:active:not(:disabled) { transform: translateY(1px); filter: brightness(1.12); }
button.step:disabled { opacity: .4; }
.step.hold, .step.done { border-color: var(--line); }
.step.hold .t, .step.done .t { white-space: normal; font-weight: 400; }
.pips { color: var(--brass); letter-spacing: .12em; margin-left: 4px; font-size: 13px; }
.actions { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 6px; padding: 6px; border-top: 1px solid var(--line); }
.btn {
  min-height: 52px; padding: 6px 8px; background: var(--panel-hi); border: 1px solid var(--line); border-radius: 4px;
  display: grid; place-items: center; text-align: center; line-height: 1.15; font-weight: 600;
}
.btn small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--ink); }
.btn.primary small { color: #3a2f12; }
.btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(1.12); }
.btn:disabled { opacity: .4; cursor: default; }

/* ---- sheets */
.veil { position: fixed; inset: 0; background: rgba(5, 9, 12, .78); display: grid; place-items: center;
  padding: max(10px, env(safe-area-inset-top, 0px)) var(--gutter-r) max(10px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); z-index: 20; }
.sheet { width: min(1000px, 100%); max-height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
.sheet > header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet h2 { margin: 0; font: 400 19px var(--display); }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px; min-height: 0; flex: 1 1 auto; }
.sheet footer { padding: 8px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }

.decision .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; }
.decision .story { font: 400 18px/1.5 var(--display); }
.decision .opts { display: grid; gap: 8px; align-content: start; }
.opt { text-align: left; min-height: 56px; padding: 10px 12px; background: var(--panel-hi); border: 1px solid var(--line); border-radius: 4px; display: grid; gap: 3px; }
.opt b { font-weight: 600; font-size: 15px; }
.opt span { color: var(--dim); font-size: 12.5px; }
.opt:active { border-color: var(--brass); }
.sheet.decision { border-color: var(--brass); }
.sheet.decision h2 { color: var(--brass); letter-spacing: .06em; }

.orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.orders-grid .opt { min-height: 60px; }
.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.note { font-size: 12.5px; color: var(--dim); margin: 10px 0 0; }

.reports { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.reports h3 { margin: 0 0 6px; font: 400 15px var(--display); letter-spacing: .04em; }
.reports .row { display: contents; }
.reports .c { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.reports .c.log { font-family: var(--display); }
.end-title { font: 400 26px var(--display); margin: 0 0 6px; }
.epi p { margin: 0 0 8px; font: 400 17px/1.5 var(--display); }
.epi p.hush { color: var(--dim); font-style: italic; }

.title-card { text-align: center; max-width: 640px; margin: 0 auto; }
.title-card h1 { font: 400 40px/1.05 var(--display); margin: 4px 0 10px; letter-spacing: .02em; }
.title-card p { margin: 0 0 10px; color: var(--paper); font-size: 16px; }
.title-card .rule { display: grid; gap: 6px; text-align: left; margin: 12px auto; max-width: 520px; font-size: 14px; color: var(--dim); }
.title-card .rule b { color: var(--paper); }
.title-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.title-card .btn { min-width: 200px; }

/* ---- portrait: the game is landscape */
.rotate { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  .rotate { position: fixed; inset: 0; z-index: 50; background: var(--hull); display: grid; place-content: center; text-align: center; padding: 24px; gap: 10px; }
  .rotate .ico { font-size: 54px; transform: rotate(90deg); }
  .rotate p { margin: 0; font: 400 20px var(--display); }
}
/* ---- low phones, landscape */
@media (max-height: 420px) {
  .gv { font-size: 14px; } .gv small { font-size: 10px; } .gg { padding: 3px 5px; } .gauges { gap: 4px; margin-top: 5px; }
  .top { min-height: 40px; } .orders-chip .t { font-size: 15px; }
  .icon-btn { width: 40px; height: 40px; }
  .btn { min-height: 46px; }
  .scroll { padding: 6px 8px; }
  .led { gap: 6px; } .men li { padding: 4px 2px; }
  .title-card h1 { font-size: 30px; } .title-card p { font-size: 14px; }
  .decision .story { font-size: 16px; }
}
@media (max-width: 760px) { .btn small.wide { display: none; } }
@media (max-width: 720px) {
  .cols { grid-template-columns: minmax(150px, 30%) minmax(0, 1fr) minmax(0, 1fr); }
  .led .r { grid-template-columns: 52px minmax(0, 1fr) auto; }
}
@media (max-width: 560px) { .eyegrid { grid-template-columns: 1fr; } .decision .grid { grid-template-columns: 1fr; } .orders-grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
</head>
<body style="margin:0">
<div id="app"></div>
<div class="rotate" role="alert"><span class="ico" aria-hidden="true">⟳</span><p>Turn your phone sideways.</p><span class="dim">The bridge is laid out for a wide screen.</span></div>
<script>
/* Depths Within: the dread engine, ported line by line from dread/*.py.
 *
 * It is a port, not a rewrite: same names (snake_case where the data files use them), same
 * order of operations, and the same random numbers. `PyRandom` reproduces CPython's
 * Mersenne Twister (seeding, random(), choice(), choices(), randint(), uniform()), and
 * `fsum` reproduces the compensated float sum that Python 3.12+ uses in sum(). Given the same
 * seed and the same inputs, the log it writes is the log the Python engine writes
 * (tests/test_web_parity.py checks that, on the shipped file).
 *
 * No DOM in here, so Node can run it.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Dread = factory();

        ship.flags.delete(fx.name);
      } else if (op === 'routine') {
        ship.routines[fx.item] = clamp(ship.routines[fx.item] + fx.value);
      } else if (op === 'rumor') {
        let r = ship.rumors.get(fx.id);
        if (!r) r = new Rumor(fx.id, fx.text, fx.intensity !== undefined ? fx.intensity : 0.5, Object.assign({}, fx.drift || {}));
        r.intensity = clamp(Math.max(r.intensity, fx.intensity !== undefined ? fx.intensity : r.intensity));
        const seed = fx.seed !== undefined ? fx.seed : 'target';
        const seeded = seed !== 'none' ? who(seed, world, target) : [];
        for (const c of seeded) { r.believers.add(c.id); c.believes.add(r.id); }
        ship.rumors.set(r.id, r);
      } else if (op === 'phantom') {
        const aud = who(fx.audible, world, target).map((c) => c.id);
        if (aud.length) world.deck.spawn(fx.kind, aud, fx.intensity !== undefined ? fx.intensity : 0.4, fx.text || '', world.rng, world.crew);
      } else if (op === 'vanish') {
        for (const c of who(fx.who, world, target)) c.missing = true;
        ship.flags.add('sailor_missing');
      } else if (op === 'isolate') {
        for (const c of who(fx.who, world, target)) c.isolated = true;
      } else if (op === 'release') {
        for (const c of who(fx.who, world, target)) { c.isolated = false; c.isolated_ticks = 0; }
      } else if (op === 'kill') {
        for (const c of who(fx.who, world, target)) c.alive = false;
      } else if (op === 'combat') {
        world.combat(fx.severity);
      } else if (op === 'log_entry') {
        world.ship[`log_${fx.kind}`] += 1;
      } else if (op === 'peace_news') {
        if (world.truth.war_over) {
          world.ship.flags.add('peace_known');
          world.log.push(`${tag(world.tick_no)} The radio man reads the date aloud twice. It is eleven months after an armistice nobody told us about.`);
        } else world.log.push(`${tag(world.tick_no)} Something about a date, and a word that might be 'armistice', or 'amnesty', or a man's name.`);
      } else if (op === 'traffic_act') {
        trafficAct(world, fx.action);
      } else if (op === 'engage_order') {

      } else if (op === 'depth_order') {
        world.ship.depth_order = fx.value; world.ship.depth_extra = 0;
      } else if (op === 'emergency_surface') {
        const sh = world.ship;
        sh.surfaced = true; sh.scope_up = false; sh.depth_extra = 0; sh.flags.delete('sinking');
        sh.hull = clamp(sh.hull - 0.04);
        for (const c of world.active_crew()) c.fear = clamp(c.fear + 0.06);

      } else if (op === 'tubes') {
        for (let i = 0; i < 4; i++) if (world.ship.tubes[i] !== 'empty') world.ship.tubes[i] = fx.state;
      } else if (op === 'fire') {
        fireTorpedoes(world, fx.n);
      } else if (op === 'leave_station') {
        world.log.push(`${tag(world.tick_no)} ${world.leave_station()}`);
      } else if (op === 'check_world') {
        world.log.push(`${tag(world.tick_no)} ${world.check_world()}`);
      } else if (op === 'summon_notice') {
        world.notice_at_override = world.vigil_ticks + 6;
      } else if (op === 'travel_delay') {

      } else if (op === 'set') {
        ship[fx.stat] = fx.value;
      } else if (op === 'time') {

      } else if (op === 'rumor_intensity') {
        const r = ship.rumors.get(fx.id);
        if (r) r.intensity = clamp(r.intensity + fx.value);
      } else if (op === 'verify_orders') {
        world.log.push(`${tag(world.tick_no)} ${orders.verify_orders(world)}`);
      } else if (op === 'mission_outcome') {
        world.resolve_mission(fx.value);
      } else if (op === 'if') {
        applyEffects(evaluate(fx.cond, world) ? fx.then : (fx.else || []), world, target);
      } else if (op === 'chance') {
        let p = fx.p;
        for (const m of ('mod' in fx ? [fx.mod] : []).concat(fx.mods || [])) p += m.k * (resolvePath(m.path, world) - (m.ref !== undefined ? m.ref : 0.0));
        for (const [flag, bonus] of Object.entries(fx.if_flag || {})) if (ship.flags.has(flag)) p += bonus;
        applyEffects(world.rng.random() < clamp(p, 0.02, 0.98) ? fx.then : (fx.else || []), world, target);
      } else if (op === 'mute_phantoms') {
        world.deck.mute_all();
      } else if (op === 'log') {

      } else {
        throw new Error(`unknown effect op ${op}`);
      }
    }
  }

  // ---------------------------------------------------------------- orders
  const orders = {
    silence_sonar(w) {
      w.ship.sonar_on = false; w.deck.mute_all();
      for (const c of w.active_crew()) if (c.role === 'sonar') c.fear = clamp(c.fear - 0.15);
      return 'Sonar off. The headsets go quiet.';
    },
    restore_sonar(w) { w.ship.sonar_on = true; return 'Sonar back on.'; },
    isolate(w, cid) {
      const c = w.crew_by_id(cid);
      if (!c || !c.active || c.isolated) return 'Nothing to do.';
      c.isolated = true; c.trust = clamp(c.trust - 0.25); c.guilt = clamp(c.guilt + 0.15);
      w.ship.rumors.forEach((r) => r.believers.delete(cid));
      for (const o of w.active_crew()) o.trust = clamp(o.trust - 0.03);
      w.ship.attention = clamp(w.ship.attention + 0.03);
      return `${c.name} is confined to the forward berth.`;
    },
    release(w, cid) {
      const c = w.crew_by_id(cid);
      if (!c || !c.isolated) return 'Nothing to do.';
      c.isolated = false; c.isolated_ticks = 0;
      return `${c.name} is back on the watch bill.`;
    },
    force_compartment(w, cid) {
      const c = w.crew_by_id(cid);
      if (!c || !c.active) return 'Nothing to do.';
      w.ship.hull = clamp(w.ship.hull + 0.05);
      c.fear = clamp(c.fear + 0.2); c.guilt = clamp(c.guilt + 0.1);
      for (const o of w.active_crew()) { o.trust = clamp(o.trust - 0.12); o.guilt = clamp(o.guilt + 0.05); }
      return `${c.name} goes in. The repair holds.`;
    },
    stand_down(w) {
      w.ship.stand_down = true; w.ship.rest_cancelled = false;
      return 'All hands but the skeleton watch are sent to their bunks.';
    },
    cancel_rest(w) {
      if (!w.ship.rest_cancelled) for (const c of w.active_crew()) c.trust = clamp(c.trust - 0.03);
      w.ship.rest_cancelled = true;
      return 'Rest is cancelled for all hands.';
    },
    grant_rest(w) { w.ship.rest_cancelled = false; return 'Normal watch rotation resumes.'; },
    hold_ritual(w) {
      const s = w.ship;
      const order = Object.keys(s.routines).map((k, i) => [k, i]).sort((a, b) => (s.routines[a[0]] - s.routines[b[0]]) || (a[1] - b[1]));
      for (const [item] of order.slice(0, 2)) s.routines[item] = clamp(s.routines[item] + 0.4);
      w.lose_hours(0.75);
      for (const c of w.active_crew()) c.fear = clamp(c.fear - 0.03);
      return 'The crew eats together. Someone finds a deck of cards.';
    },
    address_crew(w) {
      const live = w.active_crew();
      if (!live.length) return 'No one to address.';
      const avg = fsum(live.map((c) => c.trust)) / live.length;
      w.ship.rumors.forEach((r) => { r.intensity = clamp(r.intensity - 0.35 * avg); });
      for (const c of live) c.trust = clamp(c.trust - 0.03 + 0.05 * avg);
      return 'The captain speaks over the intercom.';
    },
    scrub_air(w) {
      const s = w.ship;
      if (s.scrubber < 0.12) return 'The absorbent is spent.';
      s.scrubber = clamp(s.scrubber - 0.12);
      s.co2 = clamp(s.co2 - 0.004, 0.005, 0.1);
      return 'Fresh absorbent in the scrubbers.';
    },
    raise_periscope(w) { w.ship.scope_up = true; return 'The periscope rises. The sea is very bright.'; },
    lower_periscope(w) { w.ship.scope_up = false; return 'The periscope is housed.'; },
    surface(w) {
      const s = w.ship;
      s.surfaced = true; s.scope_up = false; s.co2 = Math.max(0.005, s.co2 - 0.01); s.attention = clamp(s.attention - 0.1);
      for (const c of w.active_crew()) c.fear = clamp(c.fear - 0.1);
      return 'Surfacing. The hatch opens on cold air.';
    },
    dive(w) {
      const s = w.ship;
      if (!s.surfaced) return 'We are not on the surface.';
      const err = roleError(w, 'deck');
      if (err > 0 && w.rng.random() < err * 0.8) { s.dive_lag = 2; return 'The hatch will not dog. We stay on the surface a while longer.'; }
      s.surfaced = false;
      return 'Diving.';
    },
    active_ping(w) {
      w.ship.noise = clamp(w.ship.noise + 0.35); w.ship.attention = clamp(w.ship.attention + 0.02);
      return 'One ping. The hull rings with it.';
    },
    silent_running(w, on) {
      w.ship.silent_running = on;
      return on ? 'Silent running.' : 'Resuming normal running.';
    },
    take_fix(w) { return takeFix(w); },
    load_torpedoes(w, kind) { return loadType(w, kind); },
    listen_radio(w) { return listenRadio(w); },
    call_council(w) { return callCouncil(w); },
    sick_call(w) { return sickCall(w); },
    write_log(w) { return writeLog(w); },
    set_speed(w, level) { return setSpeed(w, level); },
    set_depth(w, level) { return setDepth(w, level); },
    snorkel(w, on) { return setSnorkel(w, on); },
    damage_control(w, on) { return setDamageControl(w, on); },
    verify_orders(w) {
      const run = w.run;
      if (run === null || run.phase_fired.has('verified')) return 'Nothing more to verify.';
      run.phase_fired.add('verified');
      const s = w.ship;
      s.noise = clamp(s.noise + 0.15); s.attention = clamp(s.attention + 0.03);
      w.lose_hours(0.7);
      const roll = w.rng.random();
      if (roll < run.mission.quality * 0.8) {
        s.orders_doubt = clamp(s.orders_doubt - 0.25);
        return 'A reply confirms the order, relayed through a station you cannot identify.';
      }
      if (roll < 0.8) { s.orders_doubt = clamp(s.orders_doubt + 0.05); return 'No acknowledgement.'; }
      s.orders_doubt = clamp(s.orders_doubt + 0.2);
      s.flags.add('orders_contradicted');
      return 'The reply contradicts the order: same call sign, different cipher.';
    },
  };

  // ---------------------------------------------------------------- the world
  const DEFAULT_NAMES = ['Brandt', 'Keller', 'Vogel', 'Hahn', 'Lenz', 'Ostrow', 'Weiss', 'Maier', 'Fuchs', 'Reiter', 'Arndt', 'Kopp'];
  const HARD_LIMIT_FACTOR = 1.1, ATTENTION_FLOOR = 0.25, REST_CANCEL_FATIGUE = 0.012, PACE = 0.95;

  // ---------------------------------------------------------------- the boat's machinery (dread/systems.py)
  const SPEEDS = { slow: [0.5, 4.0], standard: [1.0, 8.0], flank: [1.6, 13.0] };
  const DEPTHS = { shallow: 60, deep: 120, test: 180 };
  const DRAIN = { slow: 0.003, standard: 0.006, flank: 0.02 }, HOTEL = 0.001, IDLE_DRAIN = 0.002;
  const ENGINE_FACTOR = { ok: 1.0, damaged: 0.6, dead: 0.3 };
  const integrity = (w, comp) => Math.max(0.0, Math.min(1.0, 1.0 - 2.0 * w.ship.damage[comp]));
  const systemState = (w, comp) => { const i = integrity(w, comp); return i < 0.35 ? 'dead' : i < 0.7 ? 'damaged' : 'ok'; };
  function roleError(w, role) {
    const crew = w.active_crew().filter((c) => c.role === role);
    if (!crew.length) return 0.6;
    const strain = fsum(crew.map((c) => (c.fear + c.fatigue) / 2)) / crew.length;
    return Math.max(0.0, Math.min(0.6, 1.2 * strain - 0.2));
  }
  // the sea floor and what the hull can bear (dread/bathy.py)
  const KEEL_MARGIN = 8;
  const seabedAt = (x, y) => Math.trunc(Math.min(900, 45 + 4.0 * Math.hypot(x - 100.0, y - 12.0) + 20 * ((Math.floor(Math.trunc(x) / 7) + Math.floor(Math.trunc(y) / 5)) % 3)));
  const crushDepth = (hull) => Math.trunc(100 + 200 * Math.max(0.0, Math.min(1.0, hull)));
  const seabedHere = (w) => { const [x, y] = trueXY(w); return seabedAt(x, y); };
  function depthM(w) {
    const s = w.ship;
    if (s.surfaced) return 0;
    if (s.scope_up) return 14;
    return Math.min(DEPTHS[s.depth_order] + s.depth_extra, Math.max(14, seabedHere(w) - KEEL_MARGIN));
  }
  const underKeel = (w) => (w.ship.surfaced || w.ship.flags.has('bottomless') ? null : Math.max(0, seabedHere(w) - depthM(w)));
  const movingNow = (w) => w.ship.returning || (w.working !== null && !w.work_blocked);
  function pace(w) {
    const s = w.ship;
    if (s.battery <= 0 && !s.surfaced) return 0.0;
    return SPEEDS[s.speed_order][0] * (s.silent_running ? 0.5 : 1.0) * ENGINE_FACTOR[systemState(w, 'engine room')];
  }
  const usableBowTubes = (w) => ({ ok: 4, damaged: 2, dead: 0 }[systemState(w, 'bow torpedo room')]);
  // torpedoes: three kinds, each with a habit (dread/systems.py)
  const TYPE_KN = { steam: 44.0, electric: 30.0, acoustic: 24.0 }, TYPE_BONUS = { steam: 0.0, electric: -0.05, acoustic: 0.15 };
  function spendOne(w) {
    const s = w.ship;
    let t = s.torpedo_type;
    if (s.types[t] <= 0) {
      t = Object.keys(s.types).reduce((a, k) => (s.types[k] > s.types[a] ? k : a), Object.keys(s.types)[0]);
      w.log.push(`${tag(w.tick_no)} No more ${s.torpedo_type} fish; the room loads ${t}.`);
      s.torpedo_type = t;
    }
    s.types[t] -= 1; s.torpedoes -= 1;
    return t;
  }
  function loadType(w, kind) {
    const s = w.ship;
    if (w.engagement !== null) return 'Not now. The room has no time to change fish.';
    if (kind === s.torpedo_type) return `The tubes already hold ${kind} torpedoes.`;
    if (s.types[kind] <= 0) return `There are no ${kind} torpedoes aboard.`;
    w.lose_hours(1.0);
    s.torpedo_type = kind;
    s.tubes = [0, 1, 2, 3, 4, 5].map((i) => (i < s.torpedoes ? 'loaded' : 'empty'));
    return `The torpedo room reloads the tubes with ${kind} fish.`;
  }
  function fireTorpedoes(w, n) {
    const s = w.ship;
    const room = w.active_crew().some((c) => c.role === 'torpedo') ? roleError(w, 'torpedo') : 0.6;
    const kind = s.torpedo_type;
    s.shot_type = kind;
    let fired = 0;
    for (let i = 0; i < usableBowTubes(w); i++) {
      if (fired < n && (s.tubes[i] === 'open' || s.tubes[i] === 'flooded') && s.torpedoes > 0) {
        if (room > 0 && w.rng.random() < 0.5 * room) {
          w.log.push(`${tag(w.tick_no)} Tube ${i + 1} does not answer.`);
          s.flags.add('tube_fail'); w.flag_expiry.set('tube_fail', w.tick_no + 2);
          continue;
        }
        s.tubes[i] = 'empty'; spendOne(w); fired += 1;
      }
    }
    if (!fired) return;
    if (kind === 'steam' && w.engagement === null && w.rng.random() < 0.35) {
      w.log.push(`${tag(w.tick_no)} The wakes run straight back to us. Her escorts have seen them.`);
      w.combat(0.4);
    } else if (kind === 'acoustic') {
      if (contactRows(w).some((r) => !r[3]) && w.rng.random() < 0.5) {
        s.flags.add('torp_ghost'); w.flag_expiry.set('torp_ghost', w.tick_no + 2);
        w.log.push(`${tag(w.tick_no)} The torpedo turns from the target toward a sound nobody else can find.`);
      }
      if (w.rng.random() < 0.04 + 0.5 * Math.max(0.0, s.noise - 0.12)) {
        s.hull = clamp(s.hull - 0.12);
        s.flags.add('torp_circular'); w.flag_expiry.set('torp_circular', w.tick_no + 2);
        for (const c of w.active_crew()) c.fear = clamp(c.fear + 0.08);
        w.log.push(`${tag(w.tick_no)} A circular run. The fish comes round for the loudest thing it knows, which is us.`);
      }
    }
  }
  function applyHelm(w, kind, level) { if (kind === 'speed') w.ship.speed_order = level; else w.ship.depth_order = level; }
  function helmOrder(w, kind, level, text) {
    const s = w.ship;
    let err = roleError(w, 'helm');
    if (systemState(w, 'control room') !== 'ok') err = Math.max(err, 0.3);
    if (err > 0 && w.rng.random() < err * 0.8) {
      s.helm_pending = [kind, level]; s.helm_lag = 2;
      return 'The helmsman repeats the old order. It will take a moment.';
    }
    applyHelm(w, kind, level);
    return text;
  }
  function setSpeed(w, level) {
    const s = w.ship;
    if (level === s.speed_order && s.helm_pending === null) return `We are already making ${level} speed.`;
    const state = systemState(w, 'engine room');
    if (level === 'flank' && state !== 'ok') return 'The engine room cannot give it.';
    if (state === 'dead' && level !== 'slow') return 'The engine room can give no more than slow.';
    return helmOrder(w, 'speed', level, `Ahead ${level}.`);
  }
  function setDepth(w, level) {
    const s = w.ship;
    if (s.surfaced) return 'We are on the surface.';
    if (level === s.depth_order && s.helm_pending === null) return `We are already at ${DEPTHS[level]} metres.`;
    if (systemState(w, 'control room') === 'dead') return 'The planes are jammed. We stay where we are.';
    const sb = seabedHere(w);
    if (DEPTHS[level] > sb - KEEL_MARGIN - 6) return `There is not the water for it: the chart gives ${sb} metres here.`;
    if (DEPTHS[level] >= crushDepth(s.hull)) return 'She would not survive it. The hull is not what it was.';

  }
  function setSnorkel(w, on) {
    const s = w.ship;
    if (on && !(s.scope_up && !s.surfaced)) return 'Snorkel depth means the periscope is up.';
    s.snorkel = on;
    return on ? 'The diesels run on the snorkel. The boat shudders and the air moves.' : 'The diesels stop.';
  }
  function setDamageControl(w, on) {
    const s = w.ship;
    if (on && s.spares <= 0) return 'There is nothing left to repair with.';
    if (on && s.hull >= 0.999) return 'Nothing is broken that anyone can find.';
    s.dc_active = on;
    return on ? 'All hands that can be spared go to the worst compartment.' : 'The damage control party stands down.';
  }
  function systemsTick(w) {
    const s = w.ship, live = w.active_crew(), t = w.tick_no;
    if (s.dive_lag > 0 && s.surfaced) {
      s.dive_lag -= 1;
      if (s.dive_lag === 0) { s.surfaced = false; w.log.push(`${tag(t)} The hatch is dogged at last. Diving.`); }
    }
    if (s.helm_pending !== null) {
      s.helm_lag -= 1;
      if (s.helm_lag <= 0) {
        const [kind, level] = s.helm_pending;
        s.helm_pending = null;
        applyHelm(w, kind, level);
        w.log.push(`${tag(t)} The helm answers: ${kind === 'speed' ? 'ahead ' + level : DEPTHS[level] + ' metres'}.`);
      }
    }
    s.dr_error = Math.min(40.0, s.dr_error + (movingNow(w) ? 0.12 : 0.03) * (1.0 + 1.5 * roleError(w, 'helm') + s.attention));
    if (s.snorkel && !(s.scope_up && !s.surfaced)) { s.snorkel = false; w.log.push(`${tag(t)} The diesels stop; there is no snorkel to breathe through.`); }
    if (s.surfaced) s.battery = clamp(s.battery + 0.06);
    else if (s.snorkel) {
      s.battery = clamp(s.battery + 0.03); s.fuel = clamp(s.fuel - 0.005); s.co2 = clamp(s.co2 - 0.004, 0.005, 0.1); s.attention = clamp(s.attention + 0.004);
    } else {
      const rate = movingNow(w) ? DRAIN[s.speed_order] : IDLE_DRAIN;
      s.battery = clamp(s.battery - (rate * (s.silent_running ? 0.6 : 1.0) + HOTEL));
    }
    if (s.battery <= 0.0 && !s.surfaced) {
      if (!s.flags.has('battery_dead')) { s.flags.add('battery_dead'); w.log.push(`${tag(t)} The batteries are flat. The lights go. We cannot move until we surface or run the diesels.`); }
    } else if (s.flags.has('battery_dead') && s.battery > 0.1) {
      s.flags.delete('battery_dead'); w.log.push(`${tag(t)} The lights come back. The motors turn.`);
    }
    if (s.battery < 0.25 && !s.surfaced) {
      for (const c of live) c.fear = clamp(c.fear + 0.003);
      s.attention = clamp(s.attention + 0.003);
    }
    if (!s.surfaced) {
      const sb = seabedHere(w);
      if (s.flags.has('sinking')) s.depth_extra = Math.min(150, s.depth_extra + 15);
      else if (s.depth_extra) s.depth_extra = Math.max(0, s.depth_extra - 10);
      const d = depthM(w);
      if (s.depth_extra && DEPTHS[s.depth_order] + s.depth_extra > sb - KEEL_MARGIN && !s.scope_up) {
