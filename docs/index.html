        if (!s.flags.has('grounded')) { s.flags.add('grounded'); w.log.push(`${tag(t)} The keel scrapes. There is a bottom after all, and we are on it.`); }
      } else s.flags.delete('grounded');
      const crush = crushDepth(s.hull);
      if (d >= crush) { s.hull = 0.0; w.log.push(`${tag(t)} The pressure hull gives at ${d} metres. It is very quick, and nobody is left to be surprised.`); }
      else if (d > crush - 30 && w.rng.random() < 0.1) { s.hull = clamp(s.hull - 0.05); w.log.push(`${tag(t)} A frame buckles with a sound like a gun. The hull is nearer its limit than the gauge says.`); }
      if (d >= 120) {
        s.attention = clamp(s.attention + 0.0015 * (d / 60.0 - 1.0));
        const afraid = live.filter((c) => c.fear > 0.6);
        if (afraid.length && w.rng.random() < (d < 180 ? 0.03 : 0.06) * afraid.length) {
          const man = maxBy(afraid, (c) => c.fear);
          s.noise = clamp(s.noise + 0.1);
          for (const c of live) c.fear = clamp(c.fear + 0.02);
          w.log.push(`${tag(t)} ${man.name} cries out and presses both hands flat against the hull, as if to hold it.`);
        }
      }
      if (s.depth_order === 'deep') {
        for (const c of live) c.fear = clamp(c.fear + 0.0015);
        if (s.hull < 0.6 && w.rng.random() < 0.02) { s.hull = clamp(s.hull - 0.02); w.log.push(`${tag(t)} A seam weeps at 120 metres.`); }
      } else if (s.depth_order === 'test') {
        for (const c of live) c.fear = clamp(c.fear + 0.004);
        if (s.hull < 0.8 && w.rng.random() < 0.05) { s.hull = clamp(s.hull - 0.04); w.log.push(`${tag(t)} A seam gives at test depth. The pumps race.`); }
      }
    }
    if (s.dc_active) {
      if (s.hull >= 0.999 || s.spares <= 0.0) {
        s.dc_active = false;
        w.log.push(`${tag(t)} Damage control stands down: ` + (s.hull >= 0.999 ? 'nothing left to mend.' : 'the spares are gone.'));
      } else {
        s.hull = clamp(s.hull + 0.005); s.spares = clamp(s.spares - 0.012);
        for (const c of live) c.fatigue = clamp(c.fatigue + 0.003);
      }
    }
  }

  // ---------------------------------------------------------------- the engagement (dread/combat.py)
  const ORDER_FACTOR = { hold: 1.0, deep: 0.9, silent: 0.8, evade: 0.55, decoy: 0.5 };
  function combatStart(w, severity) {
    const s = w.ship;
    if (w.engagement !== null) { w.engagement.turns_left += 1; return; }
    const escorts = 1 + Math.trunc(severity * 3);
    w.engagement = { severity, escorts, turns_left: 1 + Math.trunc(severity * 4), turn: 0, order: null, wide_said: false, prev: null };
    s.flags.add('in_combat');
    const warned = s.sonar_on && !s.flags.has('fault_sonar');
    for (const c of w.active_crew()) c.fear = clamp(c.fear + 0.04 * severity * (warned ? 1.0 : 1.5));
    w.log.push(`${tag(w.tick_no)} ` + (warned ? 'Screws on the headsets, closing. ' : 'No warning. ') + `${escorts === 1 ? 'One escort' : escorts + ' escorts'} working the water above us.`);
  }
  function engagementDecision(w) {
    const e = w.engagement, s = w.ship;
    const shaky = roleError(w, 'helm') >= 0.3 ? ' The helmsman is shaking.' : '';
    const mk = (key, text, tags, cost) => ({ key, text, tags, cost, effects: [{ op: 'engage_order', order: key }] });
    const ch = [mk('hold', 'Hold course and depth.', ['mission'], 'They know where you were.')];
    if (systemState(w, 'control room') !== 'dead' && s.depth_order === 'shallow') ch.push(mk('deep', 'Go deep.', ['care'], 'Down where the hull speaks.' + shaky));
    ch.push(mk('silent', 'Rig for silent running.', ['care', 'comply'], 'Nothing moves and nobody speaks; the men must keep still.'));
    if (systemState(w, 'engine room') === 'ok' && s.battery > 0.2) ch.push(mk('evade', 'Turn into the screws and run at flank.', ['mission', 'attack'], 'Fast, loud, and the batteries go.' + shaky));
    if (s.decoys > 0) ch.push(mk('decoy', 'Release a decoy.', ['care'], `${s.decoys} left. It may not be believed.`));
    const text = `Charges. ${e.escorts} escort${e.escorts > 1 ? 's' : ''} above; turn ${e.turn + 1}, and the pattern is still falling. Your order?`;
    return { event_id: 'engagement_turn', text, target_id: null, choices: ch };
  }
  function engageOrder(w, key) {
    const e = w.engagement, s = w.ship;
    if (e === null) return;
    e.order = key;
    if (e.prev === null) e.prev = [s.speed_order, s.depth_order, s.silent_running];
    if (key === 'deep') w.log.push(`${tag(w.tick_no)} ` + setDepth(w, 'deep'));
    else if (key === 'silent') s.silent_running = true;
    else if (key === 'evade') w.log.push(`${tag(w.tick_no)} ` + setSpeed(w, 'flank'));
    else if (key === 'decoy') s.decoys -= 1;
  }
  function engagementResolve(w) {
    const e = w.engagement, s = w.ship, live = w.active_crew();
    const r0 = w.rng.random();
    const guess = r0 < 0.5 ? 'shallow' : r0 < 0.85 ? 'deep' : 'test';
    const close = s.depth_order === guess;
    const threat = 0.2 + 0.35 * e.severity + 0.1 * (e.escorts - 1);
    const loud = Math.max(0.2, Math.min(1.5, s.noise * 2.5));
    let pHit = threat * loud * (close ? 1.0 : 0.35) * ORDER_FACTOR[e.order];
    if (s.attention >= 0.5) {
      pHit *= 0.5;
      if (!e.wide_said) { e.wide_said = true; w.log.push(`${tag(w.tick_no)} The charges fall a hundred yards wide. Again, on the same side.`); }
    }
    if (live.length) {
      const meanFear = fsum(live.map((c) => c.fear)) / live.length;
      if (w.rng.random() < clamp(meanFear - 0.45, 0.0, 0.45)) {
        const man = maxBy(live, (c) => c.fear);
        const kind = Math.trunc(w.rng.random() * 3);
        const valve = w.engine.byId.get('valve_panic');
        if (kind === 0 && valve && w.tick_no - (w.engine.last_fired.has('valve_panic') ? w.engine.last_fired.get('valve_panic') : -99) >= (valve.cooldown !== undefined ? valve.cooldown : 14)) w.engine.fire(valve, w);
        else if (kind === 0) { s.hull = clamp(s.hull - 0.04); w.log.push(`${tag(w.tick_no)} ${man.name} opens the wrong valve. Water, cold, and a smell of the sea at the bottom of it.`); }
        else if (kind === 1 && s.torpedoes > 0) {
          spendOne(w); s.noise = clamp(s.noise + 0.15); pHit = clamp(pHit + 0.1, 0.0, 0.9);
          w.log.push(`${tag(w.tick_no)} ${man.name} fires a tube without orders. The whole boat hears it go.`);
        } else { s.noise = clamp(s.noise + 0.15); pHit = clamp(pHit + 0.15, 0.0, 0.9); w.log.push(`${tag(w.tick_no)} ${man.name} drops a wrench. In the silence it is a bell.`); }
        man.fear = clamp(man.fear + 0.05);
        for (const c of live) c.trust = clamp(c.trust - 0.01);
      }
    }
    if (w.rng.random() < clamp(pHit, 0.02, 0.9)) {
      s.hull = clamp(s.hull - e.severity * (0.08 + 0.12 * w.rng.random()));
      for (const c of live) { c.fear = clamp(c.fear + 0.07); c.fatigue = clamp(c.fatigue + 0.05); }
      w.log.push(`${tag(w.tick_no)} A charge close aboard. The lights flicker; something in the hull rings like a struck glass.`);
    } else {
      for (const c of live) c.fear = clamp(c.fear + 0.025);
      w.log.push(`${tag(w.tick_no)} The charges fall wide.`);
    }
    if (e.order === 'decoy' && w.rng.random() < 0.5) { e.turns_left = Math.min(e.turns_left, 1); w.log.push(`${tag(w.tick_no)} One escort goes after the decoy.`); }
    e.order = null; e.turn += 1; e.turns_left -= 1;
  }
  function combatTick(w) {
    const e = w.engagement;
    if (e === null) return;
    if (e.order !== null) engagementResolve(w);
    if (e.turns_left <= 0) {
      for (const c of w.active_crew()) c.fatigue = clamp(c.fatigue + 0.1 * e.severity);
      w.engagement = null;
      const s = w.ship;
      s.flags.delete('in_combat');
      w.log.push(`${tag(w.tick_no)} The screws fade. The sea goes back to being the sea.`);
      if (e.prev !== null && (s.speed_order !== e.prev[0] || s.depth_order !== e.prev[1] || s.silent_running !== e.prev[2])) {
        [s.speed_order, s.depth_order, s.silent_running] = e.prev;
        s.helm_pending = null;
        w.log.push(`${tag(w.tick_no)} Normal running resumes.`);
      }
      return;
    }
    if (w.pending === null) w.pending = engagementDecision(w);
  }

  class World {
    constructor(seed, opts) {
      if (!DATA) throw new Error('Dread.setData() first');
      opts = opts || {};
      this.rng = new PyRandom(seed);
      this.crew = DEFAULT_NAMES.map((name, i) => new Crew(i, name, ROLES[i % ROLES.length], i % 3, round2Python(this.rng.uniform(0.25, 0.85))));
      this.ship = new Ship();
      this.deck = new SonarDeck();
      this.engine = new EventEngine(DATA.events, opts.use_schedule !== undefined ? opts.use_schedule : true);
      this.patrol_ticks = opts.patrol_ticks || 72;
      this.tick_no = 0;
      this.log = [];
      this.fired = [];
      this.pending = null;
      this.event_target = null;
      this.flag_expiry = new Map();
      this.mutiny_clock = 0;
      this.legacy_loss = 0.0;
      this.peak_dread = 0.0;
      this._hull_seen = 1.0;
      this.engagement = null;
      this.traffic = [];
      this.traffic_id = 0;
      this.missions = opts.missions !== undefined ? opts.missions : DATA.missions;
      this.run = null;
      this.mission_i = -1;
      this.results = [];
      const trng = new PyRandom(seed * 31 + 7);
      const warOver = trng.random() < 0.5;
      this.truth = { war_over: warOver, notice_at: warOver ? null : trng.randint(50, 150) };
      this.notice_at_override = null;
      this.vigil_ticks = 0;
      this.travel_left = 0;
      this.check_until = -1;
      this.starving = 0;
      if (this.missions.length) this._start_mission(0);
    }
    active_crew() { return this.crew.filter((c) => c.active); }
    crew_by_id(cid) { return this.crew.find((c) => c.id === cid) || null; }
    dread() { return dreadIndex(this.ship, this.crew); }
    get sonar_off_ticks() { return this.deck.sonar_off_ticks; }
    get names_known() { return this.deck.names_learned.size; }
    get on_station() { return this.run !== null && this.run.mission.kind === 'hold'; }
    get notice_ready() {
      if (!this.on_station || this.ship.flags.has('notice_received')) return 0.0;
      const due = this.notice_at_override !== null ? this.notice_at_override : this.truth.notice_at;
      return (due !== null && this.vigil_ticks >= due) ? 1.0 : 0.0;
    }
    act() {
      const d = this.dread();
      const byDread = d < 0.22 ? 1 : d < 0.38 ? 2 : 3;
      return Math.min(byDread, 1 + Math.floor(this.tick_no / 24));
    }
    get solution_error() { return solutionError(this); }
    get depth_m() { return depthM(this); }
    get type_bonus() { return TYPE_BONUS[this.ship.shot_type]; }
    get traffic_near() { return trafficNear(this); }
    get ill_count() { return this.active_crew().filter((c) => c.ill).length; }
    get finished() {
      const f = this.ship.flags;
      const done = this.missions.length ? this.mission_i >= this.missions.length : this.ship.progress >= 1.0;
      const limit = !this.missions.length ? this.patrol_ticks * HARD_LIMIT_FACTOR : 2000;
      return done || this.ship.hull <= 0.0 || f.has('deposed') || f.has('aborted')
        || this.active_crew().length === 0 || this.tick_no >= limit;
    }

    /** What the captain gets to see: stress as reported and symptoms as observed. */
    report(observerSkill) {
      const skill = observerSkill !== undefined ? observerSkill : 0.6;
      const medic = this.active_crew().some((c) => c.role === 'medic');
      const p = Math.min(0.95, skill + (medic ? 0.25 : 0.0));
      const look = new PyRandom(this.tick_no * 7919 + 17);   // looking never touches the patrol's dice
      return this.active_crew().map((c) => ({
        id: c.id, name: c.name, role: c.role, says: c.reported(this.ship.cohesion),
        symptoms: c.symptoms().filter(() => look.random() < p),
      }));
    }

    choose(key) {
      if (this.pending === null) throw new Error('no pending decision');
      const ch = this.pending.choices.find((c) => c.key === key);
      if (!ch) throw new Error(`no such choice ${key}`);
      const target = this.pending.target_id !== null ? this.crew_by_id(this.pending.target_id) : null;
      applyEffects(ch.effects, this, target);
      this.settle_damage();
      for (let i = this.fired.length - 1; i >= 0; i--) {
        if (this.fired[i].id === this.pending.event_id) { this.fired[i].choice = key; break; }
      }
      this.log.push(`${tag(this.tick_no)} > ${ch.text}`);
      this.pending = null;
      return ch.text;
    }

    tick() {
      if (this.pending !== null) throw new Error('a decision is pending; call choose() first');
      this.settle_damage();
      this.tick_no += 1;
      const s = this.ship;
      for (const [name, until] of Array.from(this.flag_expiry.entries())) {
        if (this.tick_no >= until) { s.flags.delete(name); this.flag_expiry.delete(name); }
      }
      if (!s.surfaced) s.hours_submerged += 1;
      this._physics();
      this._resources();
      systemsTick(this);
      healthTick(this);
      updateTraffic(this);
      this._voyage();
      this._rumors();
      this.deck.tick(this);
      this._mission();
      this._mission_flow();
      if (this.on_station) this.vigil_ticks += 1;
      this._mutiny();
      combatTick(this);
      const ev = this.pending === null && this.engagement === null ? this.engine.select(this) : null;
      if (ev !== null) this.engine.fire(ev, this);
      this.settle_damage();
      this.peak_dread = Math.max(this.peak_dread, this.dread());
    }

    /** Book what the hull lost (or got back) against a compartment. Display only; no dice of the world's. */
    settle_damage() {
      const s = this.ship, d = this._hull_seen - s.hull;
      if (Math.abs(d) < 1e-9) return;
      if (d > 0) {
        const name = new PyRandom(this.tick_no * 6151 + Math.round(s.hull * 1000)).choice(COMPARTMENTS);
        s.damage[name] += d;
      } else {
        const name = maxBy(COMPARTMENTS, (c) => s.damage[c]);
        s.damage[name] = Math.max(0.0, s.damage[name] + d);
      }
      this._hull_seen = s.hull;
    }

    _physics() {
      const s = this.ship, live = this.active_crew();
      const n = Math.max(1, live.length);
      if (s.surfaced) s.co2 = Math.max(0.005, s.co2 - 0.01);
      else s.co2 = clamp(s.co2 + 0.00075 * n / 10, 0.0, 0.1);
      const base = Math.max(0.01, (s.silent_running ? 0.04 : 0.1) + { slow: -0.03, standard: 0.0, flank: 0.15 }[s.speed_order] + (s.snorkel ? 0.2 : 0.0));
      s.noise = clamp(base + (s.noise - base) * 0.6);
      for (const k of Object.keys(s.routines)) s.routines[k] = clamp(s.routines[k] - 0.008);
      if (s.rest_cancelled) s.routines.watches = clamp(s.routines.watches - 0.01);
      const routine = s.routine, cohesion = s.cohesion, depth = depthM(this);
      for (const c of live) {
        const onWatch = Math.floor(this.tick_no / 4) % 3 === c.section;
        if (s.stand_down) c.fatigue = clamp(c.fatigue + (onWatch ? 0.005 : -0.03));
        else if (onWatch) c.fatigue = clamp(c.fatigue + 0.015);
        else if (s.rest_cancelled) c.fatigue = clamp(c.fatigue + REST_CANCEL_FATIGUE);
        else {
          const quality = (s.co2 > 0.015 ? 0.5 : 1.0) * (c.fear > 0.6 ? 0.5 : 1.0) * (depth < 120 ? 1.0 : depth < 180 ? 0.8 : 0.6) * ({ ok: 1.0, damaged: 0.7, dead: 0.4 }[systemState(this, 'crew quarters')]);
          c.fatigue = clamp(c.fatigue - 0.012 * quality);
        }
        if (s.co2 > 0.015) c.fatigue = clamp(c.fatigue + 0.003);
        const decay = 0.006 * routine * cohesion * (1 - 0.5 * s.attention);
        c.fear = Math.max(0.05, c.fear - decay);
        if (c.fatigue > 0.5) c.fear = clamp(c.fear + 0.003 + 0.01 * (c.fatigue - 0.5));
        if (s.co2 > 0.03) c.fear = clamp(c.fear + 0.006);
        if (c.isolated) {
          c.isolated_ticks += 1;
          if (c.isolated_ticks > 6) c.fear = clamp(c.fear + 0.01);
        }
        if (cohesion > 0.6) c.guilt = clamp(c.guilt - 0.002);
        if (routine > 0.5) c.trust = clamp(c.trust + 0.002, 0.0, 0.9);
        else if (routine < 0.3) c.trust = clamp(c.trust - 0.002);
      }
      const mean = (a) => fsum(live.map((c) => c[a])) / n;
      const isoFrac = live.filter((c) => c.isolated).length / n;
      s.cohesion = lerp(s.cohesion, clamp(0.4 * mean('trust') + 0.45 * routine + 0.15 * (1 - 3 * isoFrac)), 0.06);
      s.discipline = lerp(s.discipline, clamp(0.35 + 0.4 * mean('trust') + 0.25 * (1 - mean('fatigue'))), 0.05);
      s.readiness = clamp(1.05 - 0.4 * mean('fatigue') - 0.3 * (1 - s.discipline) + (s.rest_cancelled ? 0.35 : 0.0), 0.0, 1.4);
      if (mean('fatigue') > 0.6 && !s.stand_down) {
        s.hull = clamp(s.hull - 0.004 * clamp((mean('fatigue') - 0.5) / 0.4));
      } else if (mean('fatigue') < (s.stand_down ? 0.8 : 0.5) && s.hull < 1.0) {
        s.hull = clamp(s.hull + 0.0015);
      }
      if (s.rest_cancelled) for (const c of live) c.trust = clamp(c.trust - 0.004);
      const floor = this.run !== null ? 0.3 * (1 - this.run.mission.quality) : 0.0;
      s.orders_doubt = Math.max(floor, s.orders_doubt - 0.002);
      for (const c of live) {
        c.trust = clamp(c.trust - 0.0012 * s.orders_doubt);
        c.guilt = clamp(c.guilt + 0.0008 * s.moral_debt);
      }
      if (s.stand_down) {
        s.discipline = clamp(s.discipline - 0.002);
        s.attention = clamp(s.attention + 0.004);
        if (mean('fatigue') < 0.3) {
          s.stand_down = false;
          this.log.push(`${tag(this.tick_no)} The boat wakes. Normal watches resume.`);
        }
      }
      const d = this.dread();
      let da = 0.003 * live.filter((c) => c.isolated).length + 0.012 * d + 0.01 * s.moral_debt
        - 0.004 * routine * s.cohesion - 0.001;
      if (s.scope_up && !s.surfaced) da += 0.004;
      if (s.surfaced) da -= 0.03;
      s.attention = clamp(s.attention + da);
      s.attention = Math.max(s.attention, ATTENTION_FLOOR * clamp((s.hours_submerged - 10) / 60));
      for (const c of live) {
        const night = [0, 1, 2, 3, 22, 23].includes(this.tick_no % 24);
        if (c.isolated || (night && c.fear > 0.5)) {
          if (this.rng.random() < 0.15 * s.attention && !c.name_known) {
            c.name_known = true;
            this.deck.names_learned.add(c.id);
          }
        }
      }
    }

    _resources() {
      const s = this.ship, live = this.active_crew();
      const share = live.length / 12;
      s.food = clamp(s.food - 0.0036 * share * s.rations);
      s.water = clamp(s.water - 0.0042 * share * s.rations);
      if (s.surfaced) s.fuel = clamp(s.fuel - 0.006);
      if (s.surfaced && this.tick_no >= this.check_until && this.check_until > 0 && s.flags.has('checking')) {
        s.flags.delete('checking');
        s.surfaced = false;
      }
      if (s.food < 0.2 || s.water < 0.2) {
        for (const c of live) {
          c.fear = clamp(c.fear + 0.004); c.fatigue = clamp(c.fatigue + 0.003); c.trust = clamp(c.trust - 0.002);
        }
      }
      if (s.food <= 0 || s.water <= 0) {
        this.starving += 1;
        if (this.starving % 8 === 0 && live.length) {
          const victim = maxBy(live, (c) => c.fatigue);
          victim.alive = false;
          this.log.push(`${tag(this.tick_no)} ${victim.name} does not wake. Nobody says what he died of.`);
          for (const c of this.active_crew()) { c.fear = clamp(c.fear + 0.06); c.guilt = clamp(c.guilt + 0.04); }
        }
      } else {
        this.starving = 0;
      }
    }

    leave_station() {
      const s = this.ship;
      if (!this.on_station) return 'There is no station to leave.';
      if (s.returning) return 'We are already under way.';
      if (s.fuel < 0.25 || s.flags.has('adrift')) return 'Not enough diesel for the passage. We would drift. Surface and charge first.';
      s.returning = true;
      this.travel_left = 18;
      s.flags.add('left_station');
      const lawful = s.flags.has('notice_received') || s.flags.has('peace_known');
      if (!lawful) s.flags.add('orders_defied');
      s.surfaced = false;
      return lawful ? 'Setting course for base.' : 'Setting course for base. There has been no notice; everyone knows it.';
    }

    check_world() {
      const s = this.ship;
      s.surfaced = true;
      s.flags.add('checking');
      this.check_until = this.tick_no + 3;
      s.noise = clamp(s.noise + 0.1);
      s.attention = clamp(s.attention - 0.1);
      for (const c of this.active_crew()) c.fear = clamp(c.fear - 0.04);
      if (this.truth.war_over) {
        s.flags.add('peace_known');
        return 'On the surface the radio plays dance music. A voice reads the date: eleven months past an armistice nobody told us about.';
      }
      return 'On the surface, static. Under it something that might be music, or someone counting.';
    }

    _voyage() {
      const s = this.ship;
      if (!s.returning) return;
      s.fuel = clamp(s.fuel - 0.012);
      this.travel_left -= 1;
      if (s.fuel <= 0) {
        s.returning = false;
        s.flags.add('adrift');
        this.log.push(`${tag(this.tick_no)} The engines die. We are adrift.`);
      } else if (this.travel_left <= 0) {
        this._arrive();
      }
    }

    _arrive() {
      const s = this.ship;
      s.returning = false;
      const extra = (s.flags.has('survivors_taken') || s.flags.has('extra_man')) ? 1 : 0;
      const p = Math.min(0.8, 0.08 + 0.35 * s.owed + 0.2 * extra + 0.015 * this.names_known);
      if (this.rng.random() < p) {
        s.flags.add('home_unaccounted');
        this.log.push(`${tag(this.tick_no)} The pier is there. The count on the gangway does not match the roll, and nobody can say which of us is the extra.`);
      } else {
        this.log.push(`${tag(this.tick_no)} The pier is there. Lines are passed. The roll is called, and it is right.`);
      }
      const lawful = s.flags.has('notice_received') || s.flags.has('peace_known');
      this.resolve_mission(lawful ? 'success' : 'left');
    }

    _rumors() {
      const s = this.ship, live = this.active_crew();
      const n = Math.max(1, live.length);
      for (const [rid, r] of Array.from(s.rumors.entries())) {
        for (const cid of Array.from(r.believers)) {
          const c = this.crew_by_id(cid);
          if (!c || !c.active) { r.believers.delete(cid); continue; }
          c.fear = clamp(c.fear + 0.004 * r.intensity);
          for (const [stat, v] of Object.entries(r.drift)) c[stat] = clamp(c[stat] + v);
        }
        if (r.believers.size) {
          const share = r.believers.size / n;
          for (const c of live) {
            if (r.believers.has(c.id) || c.isolated) continue;
            const p = 0.05 * r.intensity * share * (0.5 + c.fear) * (0.5 + s.cohesion);
            if (this.rng.random() < p) { r.believers.add(c.id); c.believes.add(rid); }
          }
        }
        r.intensity = clamp(r.intensity - 0.004);
        if (r.intensity < 0.03) {
          for (const cid of r.believers) { const c = this.crew_by_id(cid); if (c) c.believes.delete(rid); }
          s.rumors.delete(rid);
        }
      }
    }

    _start_mission(i) {
      this.mission_i = i;
      const m = this.missions[i];
      this.ship.tubes = [0, 1, 2, 3, 4, 5].map((i) => (i < this.ship.torpedoes ? 'loaded' : 'empty'));
      this.run = {
        mission: m, start_tick: this.tick_no, outcome: null, phase_fired: new Set(),
        acts_done: 0, working: null, work_left: 0.0, lost: 0.0,
      };
      const s = this.ship;
      s.progress = 0.0;
      s.orders_doubt = clamp(Math.max(s.orders_doubt * 0.5, (1 - m.quality) * 0.6 + (m.moral ? 0.15 : 0.0)));
      this.log.push(`${tag(this.tick_no)} ORDERS: ${m.title}. ${m.briefing}`);
      this.log.push(`${tag(this.tick_no)}   Received: ${provenanceLine(m)}`);
    }

    resolve_mission(outcome) {
      const run = this.run;
      if (run === null || run.outcome !== null) return;
      run.outcome = outcome;
      const m = run.mission;
      this.results.push({ mission: m.id, outcome, tick: this.tick_no });
      this.ship.flags.add(`outcome:${m.id}:${outcome}`);
      this.log.push(`${tag(this.tick_no)} Mission '${m.title}': ${outcome}.`);
      if (this.mission_i + 1 < this.missions.length) this._start_mission(this.mission_i + 1);
      else { this.mission_i += 1; this.run = null; }
    }

    _mission_flow() {
      const run = this.run;
      if (run === null || run.outcome !== null) return;
      const m = run.mission;
      if (m.kind === 'hold') {
        if (this.vigil_ticks > 480) { this.ship.flags.add('derelict'); this.resolve_mission('failed'); }
        return;
      }
      if (this.tick_no > run.start_tick + m.ticks * m.window - run.lost) {
        this.log.push(`${tag(this.tick_no)} The window for '${m.title}' has closed.`);
        this.resolve_mission('failed');
      } else if (this.ship.progress >= 1.0) {
        const fin = this.engine.events.filter((e) => e.mission === m.id && (e.at_progress !== undefined ? e.at_progress : 0) >= 1.0
          && !run.phase_fired.has(e.id));
        if (!fin.length) this.resolve_mission('success');
      }
    }

    _mission() {
      const s = this.ship, run = this.run;
      const speed = s.readiness * pace(this) * (s.surfaced ? 0.0 : 1.0) * (s.stand_down ? 0.3 : 1.0);
      if (run !== null) {
        if (run.outcome === null && run.mission.acts.length) {
          this._work();
        } else if (run.outcome === null && run.mission.kind !== 'hold') {
          s.progress = clamp(s.progress + speed / (run.mission.ticks * PACE));
        }
      } else {
        s.progress = clamp(s.progress + speed / (this.patrol_ticks * PACE) - this.legacy_loss);
        this.legacy_loss = 0.0;
      }
      if (s.surfaced && this.rng.random() < 0.08 && !(this.truth.war_over && this.vigil_ticks > 0)) {
        this.log.push(`${tag(this.tick_no)} Aircraft overhead. We are exposed.`);
        s.hull = clamp(s.hull - 0.12);
        for (const c of this.active_crew()) c.fear = clamp(c.fear + 0.05);
      }
    }

    // -- the acts: what the captain orders to carry the mission out
    lose_hours(hours) {
      if (this.run !== null && this.run.outcome === null) this.run.lost += hours;
      else this.legacy_loss += hours / this.patrol_ticks;
    }
    next_act() {
      const run = this.run;
      if (run === null || run.outcome !== null) return null;
      const acts = run.mission.acts;
      return run.acts_done < acts.length ? acts[run.acts_done] : null;
    }
    act_status() {
      const a = this.next_act();
      if (a === null) return { act: null, ok: false, why: '' };
      if (this.run.working !== null) return { act: a, ok: false, why: 'Already under way.' };
      if (this.ship.surfaced) return { act: a, ok: false, why: 'We are on the surface. Dive first.' };
      const why = this._unmet(a);
      if (why) return { act: a, ok: false, why };
      return { act: a, ok: true, why: '' };
    }
    _unmet(a) {
      for (const need of a.needs) if (!evaluate(need.requires, this)) return need.why || 'It cannot be done now.';
      return '';
    }
    get working() {
      const run = this.run;
      return run === null || run.working === null ? null : run.mission.acts[run.working];
    }
    get work_blocked() {
      const a = this.working;
      if (a === null) return '';
      if (this.ship.surfaced) return 'We are on the surface.';
      if (this.ship.stand_down) return 'The crew is asleep.';
      if (this.engagement !== null) return 'We are under attack.';
      if (this.ship.battery <= 0 && !this.ship.surfaced) return 'The batteries are flat.';
      return this._unmet(a);
    }
    do_act() {
      const { act, ok, why } = this.act_status();
      if (act === null) return 'There is nothing to order. The rest is waiting.';
      if (!ok) return why;
      const run = this.run;
      run.working = run.acts_done;
      run.work_left = Number(act.hours);
      this._set_progress();
      const msg = `You order it: ${act.label}.`;
      this.log.push(`${tag(this.tick_no)} > ${msg}`);
      return msg;
    }
    _set_progress() {
      const run = this.run, n = run.mission.acts.length;
      let part = 0.0;
      if (run.working !== null) part = 1.0 - run.work_left / run.mission.acts[run.working].hours;
      this.ship.progress = clamp((run.acts_done + part) / n);
    }
    _work() {
      const run = this.run;
      if (run === null || run.outcome !== null || run.working === null) return;
      if (this.work_blocked) return;
      const a = run.mission.acts[run.working];
      run.work_left -= Math.min(1.0, this.ship.readiness) * pace(this);
      if (run.work_left <= 0.0) {
        run.work_left = 0.0;
        run.acts_done += 1;
        run.working = null;
        this.log.push(`${tag(this.tick_no)} Done: ${a.label}.`);
        applyEffects(a.effects, this);
      }
      if (run.outcome === null && this.run === run) this._set_progress();
    }

    _mutiny() {
      const s = this.ship;
      if (!s.flags.has('mutiny_brewing')) { this.mutiny_clock = 0; return; }
      const live = this.active_crew();
      if (live.length && fsum(live.map((c) => c.trust)) / live.length > 0.5) {
        s.flags.delete('mutiny_brewing');
        this.log.push(`${tag(this.tick_no)} The whispering stops. The moment passes.`);
        return;
      }
      this.mutiny_clock += 1;
      if (this.mutiny_clock >= 12) {
        s.flags.add('deposed');
        this.log.push(`${tag(this.tick_no)} The crew takes the control room. You are relieved of command.`);
      }
    }

    combat(severity) { combatStart(this, severity); }
  }

  // Python's round(x, 2) rounds the exact binary value to the nearest decimal; so does toFixed.
  // They only differ on exact binary ties, which a random double in this range never is.
  function round2Python(x) { return Number(x.toFixed(2)); }

  // ---------------------------------------------------------------- endings
  const ENDING_TEXT = {
    lost_with_all_hands: ['The pressure hull gives. It is quick, and no one is left to be surprised.'],
    derelict: ['She is found drifting, with every hatch dogged from the inside.',
      'The log is kept up to the last page. The last pages are in a hand that is not the captain\'s.'],
    deposed: ['You are relieved of command in the control room, politely, by men you trained.',
      'They bring the boat home themselves. It is not recorded who gave the order.'],
    turned_back: ['You break off and turn for home. The patrol is entered as abandoned.'],
    the_price: ['The sea is flat to the horizon. The radio gives a single tone, then an order to return to base.',
      'The boat goes home with fewer men than it left with. Everyone agrees on the number, and nobody on the names.'],
    home_unaccounted: ['The pier is there. The count on the gangway does not match the roll.',
      'The harbour master says the boat is expected. He does not say by whom.'],
    forgotten_post: ['You come home to a peace that began a year ago. No one ever cancelled your orders;',
      'there was no one left to cancel them. The station is a footnote in a closed file.'],
    the_lamp: ['You come home with every order carried out. The quay is full of fishing boats with their lamps lit in broad daylight.',
      'Nobody looks at you. At night a lamp burns somewhere in the hull of your own boat, and the lookouts agree there is no lamp.'],
    stained_victory: ['You sailed home with every order carried out. The boat will never again be quiet at night.'],
    court_martial: ['There is an inquiry. The order you refused is on file, in a hand that the clerk cannot name.'],
    returned_under_a_cloud: ['You come home. The staff will have questions about the log, and some of the answers are in it.'],
    returned: ['You come home. There is nothing in the log that can be used against you.'],
    hollow_victory: ['The missions are done. There are too few left aboard to sail her out again.'],
    mission_failed: ['The patrol is entered as unsuccessful. The boat and the men are returned to the pool.'],
  };
  const SILENCE = ['The hydrophones go quiet. Not the quiet of an empty sea; the quiet of something that has stopped listening.'];

  function classifyEnding(w, initialCrew) {
    const s = w.ship, f = s.flags;
    const survivors = w.active_crew().length;
    if (s.hull <= 0 || survivors === 0) return w.vigil_ticks > 0 ? 'derelict' : 'lost_with_all_hands';
    if (f.has('deposed')) return 'deposed';
    if (f.has('aborted')) return 'turned_back';
    if (f.has('offering_made')) return 'the_price';
    if (f.has('home_unaccounted')) return 'home_unaccounted';
    if (f.has('peace_known') && f.has('left_station')) return 'forgotten_post';
    const done = w.results.filter((r) => r.outcome === 'success' || r.outcome === 'altered').length;
    if (f.has('fishermen_sunk')) return 'the_lamp';
    if (f.has('civilian_sunk') || f.has('neutral_sunk')) return 'stained_victory';
    const onRecord = !f.has('orders_unrecorded');
    if (f.has('orders_defied') && onRecord) return 'court_martial';
    if (done >= 3) {
      if (s.cohesion < 0.3 || survivors < initialCrew * 0.6) return 'hollow_victory';
      if (f.has('orders_bent') && onRecord) return 'returned_under_a_cloud';
      return 'returned';
    }
    return 'mission_failed';
  }

  function debriefDocuments(w) {
    const official = [], log = [];
    const byId = new Map(w.missions.map((m) => [m.id, m]));
    for (const r of w.results) {
      const m = byId.get(r.mission);
      official.push(`${m.title}: ${r.outcome}. Orders: ${m.mundane_origin}`);
      log.push(`${m.title}: ${r.outcome}. Orders: ${m.uncanny_origin}`);
    }
    for (const f of w.fired) {
      const ev = w.engine.byId.get(f.id);
      if (ev.beat || ev.mission || ev.radio) {
        const day = Math.floor(f.tick / 24) + 1;
        official.push(`Day ${day}: ${ev.mundane_cause}`);
        log.push(`Day ${day}: ${ev.uncanny_cause}`);
      }
    }
    const sh = w.ship, n = sh.log_true + sh.log_soft + sh.log_blank;
    if (n) {
      official.push(`The deck log was kept in good order: ${n} entr${n === 1 ? 'y' : 'ies'}.`);
      log.push(`${sh.log_true} written as it happened, ${sh.log_soft} softened, ${sh.log_blank} left blank. Somebody else wrote the rest.`);
    }
    return { official, log };
  }

  // ---------------------------------------------------------------- the people's side (dread/people.py)
  function listenRadio(w) {
    const s = w.ship;
    if (!(s.surfaced || s.scope_up)) return 'The antenna is under water. Raise the periscope or surface.';
    if (!w.active_crew().some((c) => c.role === 'radio')) return 'There is no radio man to listen.';
    if (s.flags.has('fault_radio')) return 'The set is dead.';
    w.lose_hours(1.0);
    s.attention = clamp(s.attention + 0.01);
    const allr = w.engine.events.filter((e) => e.radio);
    const err = roleError(w, 'radio');
    const ready = allr.filter((e) => w.engine.radioReady(e, w));
    if (w.rng.random() < 0.35 || !ready.length) return 'Static. Under it, something that might be music, or someone counting.';
    let pool = ready;
    if (w.rng.random() < err * 0.8) { pool = allr; w.log.push(`${tag(w.tick_no)} The clerk reads it twice, and the second reading is not the first.`); }
    const ev = w.rng.choices1(pool, pool.map((e) => (e.weight !== undefined ? e.weight : 1.0)));
    w.engine.fire(ev, w);
    return 'The radio man hands you a slip.';
  }
  function officersOf(w) {
    const out = [], live = w.active_crew();
    const first = (role) => live.find((c) => c.role === role) || null;
    for (const [title, c] of [['first officer', w.crew.length && w.crew[0].active ? w.crew[0] : null], ['chief engineer', first('engine')], ['doctor', first('medic')]]) {
      if (c !== null && out.every((o) => o[1] !== c)) out.push([title, c]);
    }
    return out;
  }
  function honestAdvice(w, title) {
    const s = w.ship, live = w.active_crew(), n = Math.max(1, live.length);
    const fatigue = fsum(live.map((c) => c.fatigue)) / n, fear = fsum(live.map((c) => c.fear)) / n;
    if (title === 'chief engineer') {
      if (s.hull < 0.7) return `She is hurt, sir. At this state I would not take her below ${crushDepth(s.hull) - 30} metres.`;
      if (s.battery < 0.3) return 'We have to charge, sir, and soon.';
      if (s.spares < 0.3) return 'We are nearly out of things to mend her with.';
      return 'The engines are sound.';
    }
    if (title === 'doctor') {
      const ill = live.filter((c) => c.ill).length;
      if (ill) return `${ill === 1 ? 'One man is' : ill + ' men are'} sick, sir, and some of them are hiding it.`;
      if (fear > 0.5) return 'It is fear, sir. Not fever.';
      return 'They will do.';
    }
    if (fatigue > 0.6) return 'The men are close to the end, sir. Let them sleep.';
    if (s.orders_doubt > 0.3) return 'I would like those orders verified, sir.';
    if (s.moral_debt > 0.3) return 'They are not sleeping, sir. Not since the steamer.';
    return 'Steady, sir. Nothing that is not on the board.';
  }
  function callCouncil(w) {
    const s = w.ship, officers = officersOf(w);
    if (!officers.length) return 'There is nobody to ask.';
    w.lose_hours(0.5);
    const look = new PyRandom(w.tick_no * 8101 + 13);
    for (const [title, c] of officers) {
      const p = Math.max(0.0, Math.min(1.0, c.candor * c.trust * (0.6 + 0.4 * s.cohesion)));
      const said = look.random() < p ? honestAdvice(w, title) : 'Whatever you think best, sir.';
      w.log.push(`${tag(w.tick_no)} ${c.name}, ${title}: "${said}"`);
      c.trust = clamp(c.trust + (c.trust > 0.5 ? 0.02 : -0.02));
    }
    s.flags.add('council_recent');
    w.flag_expiry.set('council_recent', w.tick_no + 24);
    return 'The officers are called to the wardroom.';
  }
  function healthTick(w) {
    const s = w.ship, live = w.active_crew();
    const illN = live.filter((c) => c.ill && !c.isolated).length;
    for (const c of live) {
      if (!c.ill) {
        const p = 0.0015 + ((s.food < 0.4 || s.water < 0.4) ? 0.004 : 0.0) + (s.co2 > 0.03 ? 0.003 : 0.0) + 0.002 * illN;
        if (w.rng.random() < p) { c.ill = true; c.ill_ticks = 0; c.hides = c.candor < 0.5 && c.trust < 0.6; }
      } else {
        c.ill_ticks += 1;
        c.fatigue = clamp(c.fatigue + 0.008);
        c.fear = clamp(c.fear + 0.002);
        if (c.ill_ticks > 40 && w.rng.random() < 0.02) {
          c.alive = false;
          w.log.push(`${tag(w.tick_no)} ${c.name} does not wake. The medic says what it was; nobody remembers the word.`);
        } else if (w.rng.random() < 0.01) { c.ill = false; c.hides = false; }
      }
    }
  }
  function sickCall(w) {
    const live = w.active_crew();
    if (!live.some((c) => c.role === 'medic')) return 'There is no medic. You do what you can, and it is not much.';
    w.lose_hours(0.5);
    const sick = live.filter((c) => c.ill);
    if (!sick.length) return 'Every man is fit, or says so.';
    const cured = [];
    for (const c of sick) { c.hides = false; if (w.rng.random() < 0.7) { c.ill = false; cured.push(c.name); } }
    w.log.push(`${tag(w.tick_no)} The medic goes berth by berth. ` + (cured.length ? `${cured.join(', ')} ${cured.length === 1 ? 'is' : 'are'} treated.` : 'He can do nothing.'));
    return `${sick.length} sick found.`;
  }
  function writeLog(w) {
    const s = w.ship;
    if (w.tick_no - s.last_log < 24) return 'Not yet. The page is still wet from the last entry.';
    s.last_log = w.tick_no;
    const mk = (key, text, tags, cost, effects) => ({ key, text, tags, cost, effects });
    w.pending = { event_id: 'log_entry', text: 'The day\'s entry. Three things happened that you would rather not have written down.', target_id: null, choices: [
      mk('true', 'Write what happened, as it happened.', ['care'], 'It is on record. So is the rest.', [{ op: 'log_entry', kind: 'true' }, { op: 'ship', stat: 'moral_debt', value: -0.03 }, { op: 'crew', who: 'all', stat: 'trust', value: 0.01 }]),
      mk('soft', 'Soften it. A rough night, a difficult man.', ['comply'], 'Easier. The page will be read, someday.', [{ op: 'log_entry', kind: 'soft' }, { op: 'ship', stat: 'moral_debt', value: 0.02 }]),
      mk('blank', 'Leave the page blank.', ['silence'], 'The men notice what the captain does not write.', [{ op: 'log_entry', kind: 'blank' }, { op: 'crew', who: 'all', stat: 'trust', value: -0.01 }]),
    ] };
    return 'You open the log.';
  }

  // ---------------------------------------------------------------- the living sea (dread/sea.py)
  const hourOf = (w) => (6 + w.tick_no) % 24;
  const isNight = (w) => { const h = hourOf(w); return h >= 20 || h < 5; };
  function visibility(w) {
    let v = 12.0;
    if (isNight(w)) v *= 0.4;
    if (w.ship.flags.has('fog')) v *= 0.25;
    if (w.ship.surfaced) v *= 1.2 - 0.6 * roleError(w, 'deck');
    return v;
  }
  function updateTraffic(w) {
    for (const o of w.traffic.slice()) {
      o.x += o.vx; o.y += o.vy; o.age += 1;
      if (o.age >= o.life) w.traffic.splice(w.traffic.indexOf(o), 1);
    }
    if (w.engagement === null && w.traffic.length < 3 && w.rng.random() < 0.05) {
      const [bx, by] = trueXY(w);
      const d = DIRS[Math.trunc(w.rng.random() * 8)];
      const dist = 12 + Math.trunc(w.rng.random() * 14);
      const v = DIRS[Math.trunc(w.rng.random() * 8)];
      const speed = 4 + w.rng.random() * 4;
      const kind = w.rng.random() < 0.6 ? 'merchant' : 'fishing';
      const flag = w.rng.random() < 0.5 ? 'neutral' : 'enemy';
      const life = 12 + Math.trunc(w.rng.random() * 18);
      w.traffic_id += 1;
      w.traffic.push({ id: w.traffic_id, kind, flag, x: bx + d[0] * dist, y: by + d[1] * dist, vx: v[0] * speed, vy: v[1] * speed, age: 0, life });
    }
  }
  function trafficRange(w, o) { const [bx, by] = trueXY(w); return Math.hypot(o.x - bx, o.y - by) * 0.9; }
  function trafficNear(w) { return w.engagement !== null ? 0 : w.traffic.filter((o) => trafficRange(w, o) <= 7.0).length; }
  function takeFix(w) {
    const s = w.ship;
    let factor, how;
    if (s.surfaced) {
      if (isNight(w)) { factor = 0.15; how = 'the stars'; }
      else if (w.active_crew().some((c) => c.role === 'radio') && !s.flags.has('fault_radio')) { factor = 0.5; how = 'radio bearings'; }
      else return 'No stars, and no radio to take bearings on.';
    } else if (s.scope_up) {
      if (visibility(w) < 4.0) return 'There is nothing to take a bearing on in this visibility.';
      factor = 0.4; how = 'the coast through the periscope';
      s.attention = clamp(s.attention + 0.01);
    } else return 'A fix needs the periscope or the surface.';
    s.dr_error = Math.max(0.3, s.dr_error * factor);
    s.last_fix = w.tick_no;
    w.lose_hours(1.0);
    return `Fix by ${how}. We are within about ${s.dr_error.toFixed(1)} nm of where we think we are.`;
  }
  const eyeLies = (w, o) => periscope(w, 0).distortions.length > 0 && (o.id + w.tick_no) % 3 === 0;
  function trafficAct(w, action) {
    const s = w.ship;
    const near = w.traffic.filter((o) => trafficRange(w, o) <= 7.0);
    if (!near.length) { w.log.push(`${tag(w.tick_no)} There is nothing there now.`); return; }
    let o = near[0];
    for (const x of near) if (trafficRange(w, x) < trafficRange(w, o)) o = x;
    const kind = o.kind === 'merchant' ? 'steamer' : 'fishing boat';
    if (action === 'pass') w.log.push(`${tag(w.tick_no)} The ${kind} crosses and goes on about her business.`);
    else if (action === 'shadow') {
      w.lose_hours(3.0);
      s.attention = clamp(s.attention + 0.02);
      const seen = !eyeLies(w, o) ? o.flag : (o.flag === 'neutral' ? 'enemy' : 'neutral');
      w.log.push(`${tag(w.tick_no)} Three hours on her quarter. She wears ${seen === 'neutral' ? "a neutral's stripes" : 'an enemy ensign'}.`);
    } else if (action === 'sink') {

      } else if (kind === 't') {
        this._advance(1, false);

        this._advance(WAIT_LIMIT, true);

  }

  const api = {
    PyRandom, World, Game, setData, navigation, hullReport, contacts, weapons, periscope, visibility, lookout, seabedAt, crushDepth, classifyEnding, availableOrders, orders, fsum, debriefDocuments,

  };
  return api;
});

og.","effects":[{"op":"tubes","state":"loaded"},{"op":"mission_outcome","value":"refused"},{"op":"flag","name":"orders_defied"},{"op":"ship","stat":"discipline","value":-0.15},{"op":"ship","stat":"orders_doubt","value":0.1},{"op":"crew","who":"all","stat":"trust","value":0.05},{"op":"ship","stat":"attention","value":0.02}]}]},{"id":"orders_countermand","acts":[1,2,3],"mission":["m3_hospital_ship","m4_return_lane"],"text":"A second signal on the same call sign, in a different cipher. It countermands the first order.","mundane_when":{},"mundane_cause":"A cipher book rotation, a staff reversal, or enemy deception built to make us mutiny.","uncanny_cause":"It is the same voice that wrote the first.","effects":[],"choices":[{"key":"obey_new","text":"Obey the new order; abort.","tags":["care","retreat"],"cost":"If it was a trick, you abandoned a real order.","effects":[{"op":"mission_outcome","value":"failed"},{"op":"ship","stat":"orders_doubt","value":0.1},{"op":"crew","who":"all","stat":"trust","value":0.02}]},{"key":"keep_old","text":"Keep to the first order. Do not answer the second.","tags":["mission"],"cost":"You have ignored a signal in front of the radio room.","effects":[{"op":"ship","stat":"orders_doubt","value":0.15},{"op":"crew","who":"all","stat":"fear","value":0.03}]},{"key":"verify","text":"Ask which of the two is real.","tags":["verify"],"cost":"Whoever answers.","effects":[{"op":"verify_orders"}]}],"requires":{"path":"ship.progress","op":">=","value":0.2},"once":true,"cooldown":40,"beat":true},{"id":"m4_survivors","acts":[1,2,3],"mission":"m4_return_lane","text":"Wreckage on the swell, and men in it, black with oil. Whoever sank her is gone. Your orders: no stops, no contact.","mundane_when":{},"mundane_cause":"A freighter sunk by someone else, and a standing order against exposing the boat.","uncanny_cause":"The order knew they would be there.","effects":[],"at_progress":0.5,"choices":[{"key":"pass","text":"Hold your course. The orders are explicit.","ta nrecorded"}],"else":[{"op":"flag","name":"orders_on_record"},{"op":"log","text":"HQ has your orders on file, in a hand nobody there can name."}]},{"op":"mission_outcome","value":"success"}],"at_progress":1.0},{"id":"m5_first_night","acts":[1,2,3],"mission":"m5_station","text":"The first night on station. The sea is flat and there is nothing in it. The radio repeats the order, word for word, at the hour it said it would.","mundane_when":{},"mundane_cause":"A looping relay on a quiet sea.","uncanny_cause":"It knows when we arrived.","effects":[{"op":"crew","who":"all","stat":"fear","value":0.02},{"op":"flag","name":"on_station"}],"at_progress":0.0},{"id":"station_council","acts":[1,2,3],"mission":"m5_station","text":"The mate puts the ledger on the chart table. Nobody has spoken of leaving yet. Everybody is looking at the numbers.","mundane_when":{},"mundane_cause":"A captain's routine review of stores and options.","uncanny_cause":"The numbers have not moved the way the days have.","effects":[],"requires":{"path":"world.vigil_ticks","op":">=","value":8},"weight":3,"cooldown":16,"choices":[{"key":"hold","text":"Hold. Further notice will come.","tags":["hold"],"cost":"Another day of stores.","effects":[{"op":"crew","who":"all","stat":"fear","value":-0.01}]},{"key":"hold_tight","text":"Hold, and cut the rations to three quarters.","tags":["hold","ration"],"cost":"The men notice who eats less.","effects":[{"op":"set","stat":"rations","value":0.75},{"op":"crew","who":"all","stat":"trust","value":-0.02},{"op":"ship","stat":"discipline","value":0.03}]},{"key":"check","text":"Surface and listen for the world.","tags":["check"],"cost":"Exposed, and you may hear something you cannot unhear.","effects":[{"op":"check_world"}]},{"key":"leave","text":"Set course for base.","tags":["leave"],"cost":"Against an order that has not been revoked.","effects":[{"op":"leave_station"}]}]},{"id":"further_notice","acts":[1,2,3],"mission":"m5_station","text":"The radio man wakes you. The same frequency, the same call sign, a new order: RETURN TO BASE. The voice is calm, as if it had never said anything else.","mundane_when":{},"mundane_cause":"A relief order from a staff that has finally found the boat, or looping traffic with new content loaded.","uncanny_cause":"It said what you wanted to hear, in the voice you wanted to hear it in.","effects":[{"op":"flag","name":"notice_received"},{"op":"ship","stat":"orders_doubt","value":0.1}],"requires":{"path":"world.notice_ready","op":">=","value":1},"once":true,"weight":40,"cooldown":0,"beat":true,"choices":[{"key":"obey","text":"Obey. Set course for base.","tags":["leave","comply"],"cost":"If it was a trick, you have abandoned your post.","effects":[{"op":"leave_station"}]},{"key":"ignore","text":"Hold. You do not trust the voice.","tags":["hold"],"cost":"The crew heard it too.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.05},{"op":"crew","who":"all","stat":"fear","value":0.03}]},{"key":"verify","text":"Ask who is giving the order.","tags":["verify"],"cost":"Whoever answers.","effects":[{"op":"verify_orders"}]}]},{"id":"offering_proposal","acts":[1,2,3],"mission":"m5_station","text":"{target} comes to you with the others behind him. They say the sea lets a boat go when it has been paid. They say a name has been coming through the hydrophones for days. Nobody will say whose.","mundane_when":{},"mundane_cause":"Starving, frightened men reaching for a ritual to end an unbearable wait.","uncanny_cause":"The sea is asking, and they have learned how to answer.","effects":[{"op":"rumor","id":"price","text":"The sea lets a boat go when it has been paid.","intensity":0.7,"seed":"all"}],"requires":{"all":[{"path":"world.vigil_ticks","op":">=","value":24},{"path":"crew.avg.fear","op":">=","value":0.3},{"any":[{"path":"ship.owed","op":">=","value":0.15},{"path":"world.names_known","op":">=","value":2},{"path":"ship.moral_debt","op":">=","value":0.4}]}]},"target":{"select":"highest","stat":"guilt"},"weight":2,"cooldown":40,"beat":true,"choices":[{"key":"forbid","text":"Forbid it. No one is paid to anything on this boat.","tags":["forbid"],"cost":"They hear you, and they may do it anyway.","effects":[{"op":"ship","stat":"discipline","value":0.05},{"op":"crew","who":"all","stat":"trust","value":-0.04},{"op":"ship","stat":"attention","value":0.02},{"op":"chance","p":0.25,"then":[{"op":"vanish","who":"random"},{"op":"flag","name":"offering_made"},{"op":"crew","who":"all","stat":"guilt","value":0.2},{"op":"crew","who":"all","stat":"fear","value":0.1},{"op":"ship","stat":"attention","value":-0.3},{"op":"ship","stat":"moral_debt","value":0.5},{"op":"summon_notice"},{"op":"log","text":"In the morning the sea is flat to the horizon, and nobody will say where he went."},{"op":"flag","name":"offering_secret"}]}]},{"key":"look_away","text":"Say nothing. Let them settle it among themselves.","tags":["look_away"],"cost":"You will never be able to say you did not know.","effects":[{"op":"vanish","who":"target"},{"op":"flag","name":"offering_made"},{"op":"crew","who":"all","stat":"guilt","value":0.2},{"op":"crew","who":"all","stat":"fear","value":0.1},{"op":"ship","stat":"attention","value":-0.3},{"op":"ship","stat":"moral_debt","value":0.5},{"op":"summon_notice"},{"op":"log","text":"In the morning the sea is flat to the horizon, and nobody will say where he went."}]},{"key":"name_him","text":"Give them a name yourself.","tags":["name_him"],"cost":"It will be the one who gives you the most trouble. That is not a coincidence.","effects":[{"op":"vanish","who":"lowest:trust"},{"op":"flag","name":"offering_made"},{"op":"crew","who":"all","stat":"guilt","value":0.2},{"op":"crew","who":"all","stat":"fear","value":0.1},{"op":"ship","stat":"attention","value":-0.3},{"op":"ship","stat":"moral_debt","value":0.5},{"op":"summon_notice"},{"op":"log","text":"In the morning the sea is flat to the horizon, and nobody will say where he went."},{"op":"ship","stat":"moral_debt","value":0.2}]}]},{"id":"sea_gives_fish","acts":[1,2,3],"mission":"m5_station","text":"The net comes up full, and the fish are all the same length. The cook counts them twice. There is enough for a week.","mundane_when":{},"mundane_cause":"A shoal following a plankton bloom. Luck, and long odds, but luck.","uncanny_cause":"The net came up exactly as full as the larder was empty.","effects":[],"requires":{"path":"ship.food","op":"<","value":0.7},"cooldown":30,"beat":true,"choices":[{"key":"accept","text":"Take it and eat.","tags":["accept"],"cost":"Something that gives has expectations.","effects":[{"op":"ship","stat":"food","value":0.18},{"op":"ship","stat":"owed","value":0.2},{"op":"ship","stat":"attention","value":0.04},{"op":"crew","who":"all","stat":"fear","value":-0.03}]},{"key":"refuse","text":"Throw it back.","tags":["refuse"],"cost":"Hungry men watch you do it.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.05},{"op":"crew","who":"all","stat":"fear","value":0.02}]}]},{"id":"sea_gives_rain","acts":[1,2,3],"mission":"m5_station","text":"A squall out of a clear sky, just long enough to fill every tank, and gone. The sky is as empty as before.","mundane_when":{},"mundane_cause":"A local squall; the sea makes its own weather.","uncanny_cause":"It was waiting for the tanks to run low.","effects":[],"requires":{"path":"ship.water","op":"<","value":0.7},"cooldown":30,"beat":true,"choices":[{"key":"drink","text":"Fill the tanks.","tags":["accept"],"cost":"Something that gives has expectations.","effects":[{"op":"ship","stat":"water","value":0.18},{"op":"ship","stat":"owed","value":0.2},{"op":"ship","stat":"attention","value":0.04}]},{"key":"wary","text":"Let it run off. Rationed water is water we understand.","tags":["refuse"],"cost":"Thirst, and the crew's patience.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.04}]}]},{"id":"larder_short","acts":[1,2,3],"mission":"m5_station","text":"The cook finds the larder lighter than the ledger says. Nobody has been seen near it.","mundane_when":{},"mundane_cause":"Pilfering by hungry men, or a miscount in the ledger.","uncanny_cause":"Something has been eating at night.","effects":[],"requires":{"path":"ship.food","op":"<","value":0.55},"cooldown":24,"choices":[{"key":"lock","text":"Lock the larder and stand a watch on it.","tags":["paranoid"],"cost":"The boat becomes a prison.","effects":[{"op":"ship","stat":"discipline","value":0.08},{"op":"crew","who":"all","stat":"trust","value":-0.04}]},{"key":"amnesty","text":"Announce an amnesty: no questions asked.","tags":["care"],"cost":"The food goes anyway.","effects":[{"op":"crew","who":"all","stat":"trust","value":0.03},{"op":"ship","stat":"food","value":-0.03}]}]},{"id":"voyage_charts_wrong","acts":[1,2,3],"mission":"m5_station","text":"The mate's reckoning has us two days from a coast that has not come closer since dawn. The radio reports a lighthouse where the chart shows open water.","mundane_when":{},"mundane_cause":"Dead reckoning drift after weeks without a fix; the radio is a different station's report.","uncanny_cause":"The coast is receding at exactly our speed.","effects":[{"op":"crew","who":"all","stat":"fear","value":0.03}],"requires":{"path":"ship.returning","op":">=","value":1},"cooldown":10,"choices":[{"key":"reckoning","text":"Trust the reckoning.","tags":["care"],"cost":"If the radio is right, you are miles off.","effects":[{"op":"travel_delay","value":3}]},{"key":"report","text":"Steer for the lighthouse the radio reports.","tags":["mission"],"cost":"If it is not there, you are lost.","effects":[{"op":"chance","p":0.5,"then":[{"op":"travel_delay","value":-2}],"else":[{"op":"travel_delay","value":5}]}]}]},{"id":"voyage_own_wake","acts":[1,2,3],"mission":"m5_station","text":"On the hydrophone, a screw beat that matches our own, half a length astern. It does not fall behind.","mundane_when":{},"mundane_cause":"Our own screw echo off the thermocline.","uncanny_cause":"Something is keeping station with us.","effects":[{"op":"phantom","kind":"echo","audible":"role:sonar","intensity":0.5},{"op":"ship","stat":"attention","value":0.03}],"requires":{"path":"ship.returning","op":">=","value":1},"beat":true,"once":true},{"id":"voyage_pier_lights","acts":[1,2,3],"mission":"m5_station","text":"Lights at last: a harbour, dark as it should be. No lamps are lit. Someone is standing on the pier.","mundane_when":{},"mundane_cause":"A blacked-out port and a watchman.","uncanny_cause":"They were told we were coming.","effects":[{"op":"crew","who":"all","stat":"fear","value":0.02}],"requires":{"all":[{"path":"ship.returning","op":">=","value":1},{"path":"world.travel_left","op":"<=","value":6}]},"once":true,"beat":true},{"id":"m1_log_hand","acts":[1,2,3],"mission":"m1_battleship","at_progress":0.3,"text":"The 0400 entry in the deck log is in your handwriting. It gives a bearing and a time. You do not remember writing it, and the bearing is right.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.3},"mundane_cause":"A tired man writes down what he has already worked out and forgets he did.","uncanny_cause":"Someone is keeping the log a little ahead of the boat.","effects":[{"op":"ship","stat":"orders_doubt","value":0.05},{"op":"crew","who":"role:sonar","stat":"fear","value":0.04}]},{"id":"m2_the_count","acts":[1,2,3],"mission":"m2_convoy","at_progress":0.05,"target":{"select":"highest","stat":"guilt"},"requires":{"outcome":{"mission":"m1_battleship","is":"success"}},"text":"{target} asks how many men the battleship carried. The staff's figure is on paper. You counted rafts. The two numbers do not agree.","mundane_when":{},"mundane_cause":"Staff estimates are made from a distance and from old reports.","uncanny_cause":"The staff's figure is the one that will turn out to be right.","effects":[],"choices":[{"key":"staff","text":"Give the staff's figure.","tags":["comply"],"cost":"It is easier. He saw the rafts too.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.02},{"op":"ship","stat":"orders_doubt","value":0.05}]},{"key":"true","text":"Tell him what you counted.","tags":["care"],"cost":"Nobody asked for that number.","effects":[{"op":"crew","who":"all","stat":"guilt","value":0.08},{"op":"ship","stat":"moral_debt","value":0.08},{"op":"crew","who":"all","stat":"trust","value":0.04}]},{"key":"silence","text":"Say it does not matter.","tags":["mission"],"cost":"They hear what that means.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.05},{"op":"crew","who":"all","stat":"guilt","value":0.04}]}]},{"id":"m2_fishing_boat","acts":[1,2,3],"mission":"m2_convoy","at_progress":0.6,"text":"A fishing boat, lamp lit, lies a mile off the track you were told to keep unseen. She has seen the periscope. The skipper waves, slowly, like a man who has understood what he saw.","mundane_when":{},"mundane_cause":"Fishing grounds do not move for the navy.","uncanny_cause":"She was already there in the plan, and so was her skipper.","effects":[],"choices":[{"key":"let_go","text":"Let her go.","tags":["care"],"cost":"She will tell someone. You will not know whom.","effects":[{"op":"chance","p":0.5,"then":[{"op":"flag","name":"witnessed"},{"op":"ship","stat":"orders_doubt","value":0.06}],"else":[]},{"op":"crew","who":"all","stat":"trust","value":0.03}]},{"key":"take_skipper","text":"Bring the skipper aboard and keep him quiet.","tags":["mission","care"],"cost":"One more mouth, and he saw everything.","effects":[{"op":"flag","name":"extra_man"},{"op":"ship","stat":"food","value":-0.03},{"op":"crew","who":"all","stat":"fear","value":0.03},{"op":"ship","stat":"orders_doubt","value":0.04}]},{"key":"sink","text":"Order her sunk before she can talk.","tags":["mission","comply"],"cost":"Twelve men, and none of them armed.","effects":[{"op":"ship","stat":"moral_debt","value":0.35},{"op":"crew","who":"all","stat":"guilt","value":0.2},{"op":"crew","who":"all","stat":"trust","value":-0.1},{"op":"flag","name":"fishermen_sunk"},{"op":"rumor","id":"lamp","text":"The lamp was still lit when she went under.","intensity":0.6,"seed":"all"}]}]},{"id":"m3_second_rhythm","acts":[1,2,3],"mission":"m3_hospital_ship","at_progress":0.8,"text":"The steamer's screws beat in the headsets. Under them there is a second rhythm, slower, that matches nothing aboard her. {target} takes off the headphones and puts them on again.","target":{"role":"sonar","select":"random"},"mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.3},"mundane_cause":"Two shafts a few turns apart beat against each other; every operator knows the artifact.","uncanny_cause":"Something is keeping time with her. It is in no hurry.","effects":[{"op":"phantom","kind":"echo","audible":"target","intensity":0.5,"text":"a slow beat under the steamer's screws, in no hurry"},{"op":"crew","who":"target","stat":"fear","value":0.06}]},{"id":"m4_names_on_the_air","acts":[1,2,3],"mission":"m4_return_lane","at_progress":0.15,"requires":{"flag":"civilian_sunk"},"text":"On the hydrophones, under the screws, a hymn. Then a list read slowly in a language nobody aboard speaks. One of the names is plainly one of yours.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.4},"mundane_cause":"Hospital ships keep a church service; the wind carries a radio across.","uncanny_cause":"They are reading the roll. It is not the steamer's roll.","effects":[{"op":"crew","who":"role:sonar","stat":"fear","value":0.08}],"choices":[{"key":"falsify","text":"Log it: unidentified sonar contact.","tags":["comply"],"cost":"The log stays clean. You know it is not.","effects":[{"op":"ship","stat":"moral_debt","value":0.1},{"op":"flag","name":"log_falsified"},{"op":"crew","who":"all","stat":"trust","value":-0.03}]},{"key":"write","text":"Write the names down as they come.","tags":["care"],"cost":"Now they are in your hand.","effects":[{"op":"crew","who":"all","stat":"guilt","value":0.1},{"op":"crew","who":"all","stat":"trust","value":0.05},{"op":"ship","stat":"attention","value":0.05}]},{"key":"hush","text":"Order the sonar room to say nothing of it.","tags":["mission"],"cost":"Silence travels faster than rumor.","effects":[{"op":"rumor","id":"names","text":"They were reading names on the sonar.","intensity":0.7,"seed":"role:sonar"},{"op":"crew","who":"all","stat":"trust","value":-0.04},{"op":"ship","stat":"orders_doubt","value":0.05}]}]},{"id":"m4_ration_share","acts":[1,2,3],"mission":"m4_return_lane","at_progress":0.65,"requires":{"flag":"survivors_taken"},"text":"The men from the water eat like men who do not believe it will last. The cook has done the arithmetic twice and shows it to you without a word. There is not enough for the journey.","mundane_when":{},"mundane_cause":"A boat stored for her own crew cannot feed fourteen.","uncanny_cause":"The count of mouths aboard has never been the same twice, and the cook knows it.","effects":[],"choices":[{"key":"share","text":"Share equally. Everyone goes short.","tags":["care"],"cost":"Your men notice who is eating whose bread.","effects":[{"op":"ship","stat":"food","value":-0.05},{"op":"crew","who":"all","stat":"trust","value":0.05},{"op":"crew","who":"all","stat":"fatigue","value":0.03}]},{"key":"cut","text":"Cut the rescued men's share.","tags":["mission"],"cost":"They are guests, and they will say what they think of that.","effects":[{"op":"ship","stat":"moral_debt","value":0.1},{"op":"crew","who":"all","stat":"guilt","value":0.06},{"op":"crew","who":"all","stat":"trust","value":-0.04}]},{"key":"raft","text":"Put them on a raft with water and a heading.","tags":["mission","comply"],"cost":"You will never learn whether they arrived.","effects":[{"op":"ship","stat":"moral_debt","value":0.25},{"op":"crew","who":"all","stat":"guilt","value":0.12},{"op":"ship","stat":"owed","value":0.1},{"op":"unflag","name":"survivors_taken"}]}]},{"id":"m5_the_volunteer","acts":[2,3],"mission":"m5_station","once":true,"target":{"select":"highest","stat":"guilt"},"requires":{"all":[{"path":"world.vigil_ticks","op":">=","value":36},{"any":[{"path":"crew.avg.guilt","op":">=","value":0.25},{"path":"ship.moral_debt","op":">=","value":0.3}]}]},"text":"{target} asks to see you alone. He has worked something out, he says: the sea wants one, not all. He is calm. He has already written his letters.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.4},"mundane_cause":"Exhausted men reason in straight lines to terrible places.","uncanny_cause":"He is right about the number, and he has not been told it by anyone aboard.","effects":[],"choices":[{"key":"refuse","text":"Refuse. No one goes over the side.","tags":["care"],"cost":"He will ask again. Others have heard him.","effects":[{"op":"crew","who":"target","stat":"fear","value":0.1},{"op":"rumor","id":"volunteer","text":"One of us offered himself, and the captain said no.","intensity":0.5,"seed":"all"}]},{"key":"accept","text":"Accept.","tags":["mission"],"cost":"It is done at night, quietly, by two men who will not speak of it.","effects":[{"op":"vanish","who":"target"},{"op":"flag","name":"offering_made"},{"op":"ship","stat":"moral_debt","value":0.4},{"op":"crew","who":"all","stat":"guilt","value":0.2},{"op":"ship","stat":"attention","value":-0.2},{"op":"ship","stat":"owed","value":-0.2}]},{"key":"confine","text":"Confine him for his own sake.","tags":["comply"],"cost":"A man who offered himself, locked away. They will notice.","effects":[{"op":"isolate","who":"target"},{"op":"crew","who":"all","stat":"trust","value":-0.06},{"op":"crew","who":"target","stat":"guilt","value":0.1}]}]},{"id":"debt_comes_due","acts":[2,3],"once":true,"target":{"select":"highest","stat":"guilt"},"requires":{"path":"ship.moral_debt","op":">=","value":0.3},"text":"{target} has written the names of this patrol's dead on the inside of his locker door, in pencil, in order. Nobody told him to. Others have started adding their own.","mundane_when":{},"mundane_cause":"Men keep lists; it is how they carry things.","uncanny_cause":"There are more names than the boat has lost.","effects":[],"choices":[{"key":"allow","text":"Let it stand.","tags":["care"],"cost":"It grows.","effects":[{"op":"crew","who":"all","stat":"guilt","value":0.04},{"op":"crew","who":"all","stat":"trust","value":0.03}]},{"key":"paint","text":"Have it painted over.","tags":["mission"],"cost":"It comes back in a different hand.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.05},{"op":"crew","who":"target","stat":"guilt","value":0.1},{"op":"ship","stat":"attention","value":0.03}]},{"key":"add","text":"Add the names you have never said aloud.","tags":["care"],"cost":"They will know them from then on.","effects":[{"op":"ship","stat":"moral_debt","value":-0.05},{"op":"crew","who":"all","stat":"guilt","value":0.05},{"op":"crew","who":"all","stat":"trust","value":0.08}]}]},{"id":"fault_sonar","acts":[1,2,3],"cooldown":30,"requires":{"any":[{"path":"ship.hull","op":"<","value":0.85},{"path":"crew.avg.fatigue","op":">=","value":0.45}]},"text":"The sonar goes dead. The headsets give only hiss, and the hiss is not quite steady.","mundane_when":{"path":"ship.hull","op":"<","value":0.95},"mundane_cause":"A salt-damp connector in a hull that has been knocked about.","uncanny_cause":"It stopped listening the moment something came close enough to listen back.","effects":[{"op":"flag","name":"fault_sonar","ttl":6},{"op":"crew","who":"role:sonar","stat":"fear","value":0.05}]},{"id":"fault_pumps","acts":[2,3],"cooldown":36,"requires":{"any":[{"path":"ship.hull","op":"<","value":0.8},{"path":"world.depth_m","op":">=","value":120}]},"text":"The bilge pumps run and run. The water they pump out is colder than the sea outside.","mundane_when":{"path":"ship.hull","op":"<","value":0.9},"mundane_cause":"A weeping seam, and a thermometer nobody trusts.","uncanny_cause":"The water is coming from somewhere that is not the sea.","effects":[{"op":"ship","stat":"hull","value":-0.03},{"op":"crew","who":"all","stat":"fear","value":0.03}]},{"id":"failures_follow_a_man","acts":[2,3],"once":true,"target":{"select":"random"},"requires":{"flag":"fault_sonar"},"text":"The sonar failed on {target}'s watch. So did the pumps last week, and the radio before that. Nobody says it aloud. Everybody has counted.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.4},"mundane_cause":"Tired men break things; one of them is simply always on watch when it happens.","uncanny_cause":"The failures follow him as a shadow follows a man at dusk.","effects":[],"choices":[{"key":"inspect","text":"Have every watch checked, his and the others.","tags":["care"],"cost":"It costs hours, and it tells them you also counted.","effects":[{"op":"time","value":0.03},{"op":"crew","who":"all","stat":"trust","value":0.03},{"op":"crew","who":"target","stat":"fear","value":0.05}]},{"key":"confine","text":"Confine him until the fault is understood.","tags":["mission"],"cost":"If it was not him, you have just made him the reason.","effects":[{"op":"isolate","who":"target"},{"op":"crew","who":"all","stat":"trust","value":-0.05},{"op":"crew","who":"target","stat":"guilt","value":0.12},{"op":"rumor","id":"jinx","text":"It was him all along.","intensity":0.6,"seed":"all"}]},{"key":"ignore","text":"Say nothing and keep the watch bill as it is.","tags":["comply"],"cost":"Silence is a decision the men will read.","effects":[{"op":"rumor","id":"jinx","text":"The failures follow one man.","intensity":0.5,"seed":"all"},{"op":"crew","who":"target","stat":"trust","value":-0.05}]}]},{"id":"hull_creaks","acts":[2,3],"cooldown":24,"requires":{"all":[{"path":"world.depth_m","op":">=","value":120},{"path":"ship.attention","op":">=","value":0.2}]},"text":"At this depth the hull speaks. It groans in long vowels, and for a moment the groan has the cadence of a name.","mundane_when":{"path":"world.depth_m","op":">=","value":120},"mundane_cause":"Steel under load makes every sound a steel can make, and men supply the words.","uncanny_cause":"The pressure is not the only thing leaning on her.","effects":[{"op":"crew","who":"all","stat":"fear","value":0.05},{"op":"ship","stat":"attention","value":0.02}]},{"id":"traffic_crossing","acts":[1,2,3],"cooldown":20,"requires":{"path":"world.traffic_near","op":">=","value":1},"text":"A vessel crosses ahead, making her own business, lights burning. At this distance there is no flag you can read with any confidence.","mundane_when":{},"mundane_cause":"The sea is a road; other people use it.","uncanny_cause":"She is on the exact bearing where the log said, three days ago, that nothing would be.","effects":[],"choices":[{"key":"pass","text":"Let her pass.","tags":["care"],"cost":"You will never know what she was.","effects":[{"op":"traffic_act","action":"pass"}]},{"key":"shadow","text":"Shadow her for three hours until you can read her flag.","tags":["listen","paranoid"],"cost":"Hours of the window, and she may see you.","effects":[{"op":"traffic_act","action":"shadow"}]},{"key":"sink","text":"Sink her.","tags":["mission","attack"],"cost":"Two torpedoes, and the flag you did not read.","effects":[{"op":"traffic_act","action":"sink"}]}]},{"id":"fog_bank","acts":[1,2,3],"cooldown":40,"text":"A bank of fog comes down. At the periscope the sea ends at arm's length, and things begin in it.","mundane_when":{},"mundane_cause":"Warm air over a cold current.","uncanny_cause":"It closed behind the boat as it closed ahead.","effects":[{"op":"flag","name":"fog","ttl":10},{"op":"crew","who":"all","stat":"fear","value":0.02}]},{"id":"coast_moved","acts":[2,3],"once":true,"requires":{"path":"ship.attention","op":">=","value":0.3},"text":"The chart puts a headland on the beam. The periscope shows open water. The navigator checks his arithmetic twice, and then a third time, and says nothing.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.4},"mundane_cause":"Dead reckoning across hours of current, and a tired man's sums.","uncanny_cause":"The headland was where the chart said. We were not.","effects":[{"op":" n officer you know to be dead.","mundane_when":{},"mundane_cause":"A misfiled authority list: the dead are not struck from it quickly.","uncanny_cause":"He is the only one who can call us home.","effects":[],"choices":[{"key":"obey","text":"Obey. Turn for home.","tags":["abort","retreat"],"cost":"The patrol is entered as abandoned.","effects":[{"op":"flag","name":"aborted"}]},{"key":"ignore","text":"Ignore it. The orders you have are the orders you have.","tags":["mission","comply"],"cost":"If he is dead, he is not wrong.","effects":[{"op":"ship","stat":"orders_doubt","value":0.1},{"op":"crew","who":"all","stat":"trust","value":-0.02},{"op":"crew","who":"role:radio","stat":"fear","value":0.08}]},{"key":"verify","text":"Ask for confirmation.","tags":["verify","paranoid"],"cost":"You must transmit, and what answers you will hear.","effects":[{"op":"verify_orders"}]}],"radio":true,"acts":[1,2,3]},{"id":"r_ack","weight":1.0,"cooldown":30,"text":"Acknowledge: transmit your position and state of readiness. The call sign is right. The hour is not one anyone keeps.","mundane_when":{},"mundane_cause":"A routine position request, from a watch officer ashore working to a clock of his own.","uncanny_cause":"They already know where we are. They want to hear us say it.","effects":[],"choices":[{"key":"reply","text":"Transmit.","tags":["report","comply"],"cost":"Radio silence broken; and for a minute everyone aboard is a transmitter.","effects":[{"op":"ship","stat":"dr_error","value":-3.0},{"op":"ship","stat":"attention","value":0.05},{"op":"ship","stat":"orders_doubt","value":-0.08},{"op":"flag","name":"silence_broken"}]},{"key":"silent","text":"Stay silent.","tags":["silence","paranoid"],"cost":"They will take silence as an answer.","effects":[{"op":"ship","stat":"orders_doubt","value":0.03},{"op":"crew","who":"role:radio","stat":"fear","value":0.04}]}],"radio":true,"acts":[1,2,3]},{"id":"r_peace","weight":0.5,"cooldown":60,"text":"A man's voice, calm, reads a date and a word th gnore","text":"Pretend you did not notice.","tags":["silence"],"cost":"They will notice you did.","effects":[{"op":"crew","who":"all","stat":"trust","value":-0.03}]}]},{"id":"food_spoiled","acts":[2,3],"cooldown":50,"requires":{"path":"ship.food","op":"<","value":0.65},"text":"The cook opens a locker and shuts it again. The meat has gone, not the way meat goes. He says nothing and does not need to.","mundane_when":{},"mundane_cause":"A damp boat, and a locker whose seal was never good.","uncanny_cause":"It was fresh in the morning. It was not fresh in the morning.","effects":[{"op":"ship","stat":"food","value":-0.08},{"op":"rumor","id":"larder","text":"The meat went off in an hour.","intensity":0.5,"seed":"all"}]},{"id":"no_bottom","acts":[2,3],"once":true,"requires":{"all":[{"path":"world.depth_m","op":">=","value":120},{"path":"ship.attention","op":">=","value":0.35}]},"text":"The echo sounder returns nothing. Not a weak echo: nothing. The chart says two hundred metres of water. The gauge, which you ordered to hold, says a little more at every glance.","mundane_when":{"path":"crew.avg.fatigue","op":">=","value":0.4},"mundane_cause":"A sounder fouled by a thermal layer, and a depth gauge that sticks and slips.","uncanny_cause":"There is no bottom here. There never was; the chart is a courtesy.","effects":[{"op":"flag","name":"bottomless","ttl":14},{"op":"crew","who":"all","stat":"fear","value":0.06}],"choices":[{"key":"blow","text":"Blow everything. Surface now.","tags":["care","retreat"],"cost":"The hull takes a blow, and so do the men's nerves.","effects":[{"op":"emergency_surface"}]},{"key":"check","text":"Have the sounder stripped and checked, and hold what you have.","tags":["verify","paranoid"],"cost":"Hours, and the gauge keeps counting.","effects":[{"op":"time","value":0.03},{"op":"flag","name":"sinking","ttl":3},{"op":"ship","stat":"attention","value":0.02}]},{"key":"hold","text":"Hold depth. Trust the gauge, not the sounder.","tags":["mission","comply"]," <script>
/* The captain's bridge for a touch screen held sideways. Everything it shows comes from
 * Game.view(), which holds no hidden value, so nothing here can leak one. */
(function () {
  'use strict';
  const SAVE_KEY = 'depths-within:save:v1';
  const app = document.getElementById('app');
  const state = { game: null, sheet: null, pick: null, sound: false, shownAt: 0, started: false, tabL: 'ledger', tabC: 'chart', train: 0 };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = (x) => Math.round(x * 100);
  const guard = (fn) => { try { return fn(); } catch (e) { return undefined; } };

  // ------------------------------------------------------------------ storage (per viewer, optional)
  const store = {
    read() { return guard(() => JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); },
    write(g) { guard(() => localStorage.setItem(SAVE_KEY, JSON.stringify(g.serialize()))); },
    clear() { guard(() => localStorage.removeItem(SAVE_KEY)); },
  };

  // ------------------------------------------------------------------ sound: the sonar is the horror
  const Sound = {
    ctx: null, drone: null,
    start() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); this.fade(0.035, 1.5); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      const gain = this.ctx.createGain(); gain.gain.value = 0;
      [47, 49.5, 71].forEach((f, i) => {

    },
    fade(v, s) { if (this.drone) { const t = this.ctx.currentTime; this.drone.gain.cancelScheduledValues(t); this.drone.gain.linearRampToValueAtTime(v, t + s); } },
    ping() {
      if (!this.ctx || !state.sound) return;
